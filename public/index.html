<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>NUTCADE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NUTCADE: a Cashu ecash wallet with a built-in 1980s arcade.">
<meta name="theme-color" content="#0a0717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one arcade cabinet screen. Marquee on top, credit counter, big push buttons, tab bar like a control deck. Single dark CRT look by design. */
:root{
  --void:#0a0717; --panel:#151030; --panel-2:#1d1642; --grid:#2c2160;
  --ink:#ece7ff; --dim:#9087c2; --faint:#5b5290;
  --pink:#ff3d8b; --cyan:#2de2ff; --gold:#ffcf3a; --lime:#5dff7a; --red:#ff5444; --violet:#8d6bff;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  --r:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--f-body); font-size:22px; line-height:1.15;
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(141,107,255,.28), transparent 60%),
    linear-gradient(rgba(44,33,96,.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(44,33,96,.35) 1px, transparent 1px);
  background-size:100% 100%, 28px 28px, 28px 28px;
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
.crt::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:200;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  box-shadow:inset 0 0 140px rgba(0,0,0,.75);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}

/* Marquee */
.marquee{position:relative;text-align:center;padding:18px 8px 14px;border:3px solid var(--violet);border-radius:var(--r);
  background:linear-gradient(180deg,#24104a,#130a2b);box-shadow:0 0 0 3px var(--void),0 0 0 6px var(--pink),0 0 26px rgba(255,61,139,.45)}
.marquee .logo svg{display:block;width:100%;height:auto;max-width:400px;margin:0 auto;filter:drop-shadow(0 0 10px rgba(255,61,139,.35))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad-keys{display:none;font-size:18px;color:var(--faint);text-align:center}
@media (pointer:fine){.pad.touch-only{display:none}.pad-keys{display:block}}
.marquee h1{margin:0;font-family:var(--f-display);font-size:clamp(28px,9vw,40px);letter-spacing:2px;color:var(--gold);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--violet),0 0 18px rgba(255,207,58,.6)}
.marquee .sub{margin-top:12px;font-family:var(--f-display);font-size:9px;letter-spacing:3px;color:var(--cyan)}
.bulbs{position:absolute;left:10px;right:10px;height:6px;display:flex;justify-content:space-between}
.bulbs.top{top:5px}.bulbs.bot{bottom:5px}
.bulbs i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:bulb 1.2s steps(1) infinite}
.bulbs i:nth-child(2n){animation-delay:.6s}
@keyframes bulb{50%{background:#5a4210;box-shadow:none}}

/* Screens */
.screen{display:grid;gap:18px;margin-top:18px}
.label{font-family:var(--f-display);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.h2{font-family:var(--f-display);font-size:13px;letter-spacing:2px;color:var(--cyan);margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--dim)}
.tiny{font-size:18px}

/* Credit counter */
.credits{padding:18px;border:2px solid var(--grid);background:rgba(10,7,23,.8);border-radius:var(--r);display:grid;gap:10px}
.credit-num{font-family:var(--f-display);font-size:clamp(30px,10.5vw,46px);color:var(--gold);text-shadow:0 0 14px rgba(255,207,58,.55);font-variant-numeric:tabular-nums;word-break:break-all}
.credit-num small{font-size:.38em;color:var(--pink);text-shadow:none;margin-left:8px}
.mint-pill{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 10px;border:1px solid var(--grid);border-radius:999px;background:var(--panel);font-size:19px;color:var(--ink);text-align:left}
.mint-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);flex:none}
.dot.off{background:var(--faint);box-shadow:none}

/* Arcade push buttons */
.pushes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.push{display:grid;justify-items:center;gap:10px;padding:14px 8px 12px;border:2px solid var(--grid);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.push .cap{width:76px;height:76px;border-radius:50%;border:4px solid rgba(0,0,0,.45);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 35%),var(--c);
  box-shadow:0 7px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 22px color-mix(in srgb,var(--c) 60%,transparent);
  display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:#140a20;transition:transform .06s,box-shadow .06s}
.push:active .cap{transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#000)}
.push .t{font-family:var(--f-display);font-size:11px;letter-spacing:2px}
.push.recv{--c:var(--lime)} .push.send{--c:var(--pink)}

/* Generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border:2px solid var(--c,var(--cyan));border-radius:var(--r);
  background:color-mix(in srgb,var(--c,var(--cyan)) 14%,transparent);color:var(--ink);font-family:var(--f-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;box-shadow:3px 3px 0 color-mix(in srgb,var(--c,var(--cyan)) 55%,#000)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 color-mix(in srgb,var(--c,var(--cyan)) 55%,#000)}
.btn.solid{background:var(--c,var(--cyan));color:#120a22}
.btn.block{width:100%}
.btn.pink{--c:var(--pink)}.btn.lime{--c:var(--lime)}.btn.gold{--c:var(--gold)}.btn.red{--c:var(--red)}.btn.violet{--c:var(--violet)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;padding:6px 10px;font-size:9px}
.linkbtn{background:none;border:0;color:var(--cyan);padding:4px;text-decoration:underline;text-underline-offset:3px}

/* Panels */
.panel{border:2px solid var(--grid);border-radius:var(--r);background:var(--panel);padding:14px;display:grid;gap:12px;min-width:0}
.panel.hot{border-color:var(--pink)}

/* Transactions */
.txs{display:grid;gap:8px}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--grid);border-radius:var(--r);background:rgba(21,16,48,.9);text-align:left}
.tx .ico{width:34px;height:34px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;border:2px solid currentColor;border-radius:var(--r)}
.tx.in .ico{color:var(--lime)} .tx.out .ico{color:var(--pink)}
.tx .mid{min-width:0}
.tx .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .note.empty{color:var(--faint);font-style:italic}
.tx .meta{font-size:17px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.tx .amt{font-family:var(--f-display);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.tx.in .amt{color:var(--lime)} .tx.out .amt{color:var(--pink)}
.chip{display:inline-block;padding:0 6px;border:1px solid currentColor;border-radius:3px;font-size:15px;line-height:20px;letter-spacing:1px}
.chip.ln{color:var(--gold)} .chip.ecash{color:var(--cyan)} .chip.pending{color:var(--violet)} .chip.failed{color:var(--red)} .chip.claimed{color:var(--dim)}
.empty-state{padding:22px 14px;text-align:center;border:2px dashed var(--grid);border-radius:var(--r);color:var(--dim)}
.empty-state b{display:block;font-family:var(--f-display);font-size:11px;color:var(--gold);margin-bottom:8px;font-weight:normal}

/* Forms */
.field{display:grid;gap:6px}
.field label{font-family:var(--f-display);font-size:9px;letter-spacing:2px;color:var(--dim)}
.inp{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--grid);border-radius:var(--r);background:#0b0820;color:var(--ink);font-size:24px}
.inp:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(45,226,255,.18)}
textarea.inp{min-height:84px;resize:vertical;font-size:21px;line-height:1.1}
.inp.amount{font-family:var(--f-display);font-size:22px;color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--grid);border-radius:var(--r);overflow:hidden}
.seg button{min-height:42px;border:0;background:transparent;color:var(--dim);font-family:var(--f-display);font-size:10px;letter-spacing:1px}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#0a0717}
.seg.three{grid-template-columns:repeat(3,1fr)}
.code{font-family:ui-monospace,monospace;font-size:13px;line-height:1.35;word-break:break-all;padding:10px;border:1px solid var(--grid);border-radius:var(--r);background:#0b0820;color:var(--cyan);max-height:120px;overflow:auto}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:var(--r);width:min(100%,280px);margin:0 auto}
.qr canvas{width:100%;height:auto;image-rendering:pixelated}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:20px}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.notice{padding:10px 12px;border:2px solid var(--c,var(--gold));border-radius:var(--r);background:color-mix(in srgb,var(--c,var(--gold)) 10%,transparent);font-size:19px}
.notice.red{--c:var(--red)} .notice.cyan{--c:var(--cyan)}
.spinner{display:inline-block;font-family:var(--f-display);font-size:10px;color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,7,23,.96);border-top:3px solid var(--violet);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{display:grid;justify-items:center;gap:6px;padding:6px 2px;border:2px solid transparent;border-radius:var(--r);background:none;color:var(--dim);font-family:var(--f-display);font-size:8px;letter-spacing:1px}
.tab svg{width:26px;height:26px;image-rendering:pixelated}
.tab[aria-current="page"]{color:var(--gold);border-color:var(--grid);background:var(--panel)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(5,3,14,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--panel);border:3px solid var(--cyan);border-bottom:0;border-radius:8px 8px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;box-shadow:0 -10px 40px rgba(45,226,255,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:2px;color:var(--gold)}
.x{width:40px;height:40px;border:2px solid var(--grid);border-radius:var(--r);background:none;color:var(--ink);font-family:var(--f-display);font-size:12px}

/* Toast */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:300;max-width:min(92vw,440px);padding:10px 14px;border:2px solid var(--c,var(--lime));border-radius:var(--r);background:#0b0820;font-size:20px;box-shadow:4px 4px 0 #000}

/* Arcade */
.cabinets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cab{display:grid;gap:8px;padding:0 0 12px;border:2px solid var(--grid);border-radius:var(--r);background:var(--panel);color:var(--ink);text-align:left;overflow:hidden}
.cab canvas{width:100%;aspect-ratio:4/3;display:block;background:#05030c;image-rendering:pixelated;border-bottom:2px solid var(--grid)}
.cab .nm{padding:0 10px;font-family:var(--f-display);font-size:10px;letter-spacing:1px;color:var(--gold)}
.cab .ds{padding:0 10px;font-size:18px;color:var(--dim)}
.cab .hs{padding:0 10px;font-size:17px;color:var(--cyan)}
.cab:active{border-color:var(--pink)}

.game-view{position:fixed;inset:0;z-index:120;background:#05030c;display:flex;flex-direction:column;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.game-top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.game-top .ttl{font-family:var(--f-display);font-size:10px;color:var(--gold);letter-spacing:1px;text-align:center;flex:1}
.screen-frame{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#gameCanvas{display:block;image-rendering:pixelated;border:3px solid var(--violet);box-shadow:0 0 0 3px #000,0 0 30px rgba(141,107,255,.4);background:#000;touch-action:none}
.pad{width:100%;max-width:480px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
.dpad button,.abtn{border:0;touch-action:none}
.dpad button{background:#2a2350;color:var(--dim);font-family:var(--f-display);font-size:12px;border:2px solid #000}
.dpad .u{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}.dpad .l{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
.dpad .c{grid-column:2;grid-row:2;background:#2a2350;border:2px solid #000;border-left:0;border-right:0}
.dpad button.on,.abtn.on{filter:brightness(1.6)}
.pad .hint{text-align:center;font-size:16px;color:var(--faint)}
.abtns{display:flex;gap:12px;align-items:center}
.abtn{width:70px;height:70px;border-radius:50%;font-family:var(--f-display);font-size:16px;color:#120a22;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 35%),var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000)}
.abtn.a{--c:var(--pink)}.abtn.b{--c:var(--cyan);width:52px;height:52px;font-size:11px}

.initials{display:grid;gap:12px;justify-items:center;text-align:center}
.initials input{width:6.5ch;text-align:center;text-transform:uppercase;font-family:var(--f-display);font-size:26px;letter-spacing:6px;color:var(--gold)}
.scores{width:100%;display:grid;gap:4px;font-family:var(--f-display);font-size:10px}
.scores div{display:grid;grid-template-columns:2.5em 4em 1fr;gap:8px;text-align:left}
.scores div span:last-child{text-align:right;color:var(--gold)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:21px}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}

@media (prefers-reduced-motion:reduce){.bulbs i,.spinner{animation:none}}
</style>

<script>/* NUTCADE audio: chiptune sfx + tiny sequencer for original music loops */
(function(){
'use strict';
let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
const prefs = () => window.NutPrefs || { sound: true, music: true };
function ensure() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.22; musBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ctx = null; }
  return ctx;
}
// unlock on first gesture
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { ensure(); if (pendingTrack) { const t = pendingTrack; pendingTrack = null; music(t); } }, { passive: true }));

function tone(type, f0, f1, dur, vol = 0.5, when = 0, bus = sfxBus) {

  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bus); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.5, when = 0, cutoff = 4000, bus = sfxBus, sweepTo) {
  const c = ctx; const t = c.currentTime + when;
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const SFX = {
  blip: () => tone('square', 660, 660, 0.05, 0.3),
  select: () => { tone('square', 523, 523, 0.05, 0.3); tone('square', 784, 784, 0.07, 0.3, 0.05); },
  coin: () => { tone('square', 988, 988, 0.07, 0.35); tone('square', 1319, 1319, 0.25, 0.35, 0.07); },
  send: () => tone('square', 1200, 200, 0.25, 0.3),
  err: () => { tone('square', 220, 220, 0.1, 0.35); tone('square', 150, 150, 0.22, 0.35, 0.1); },
  start: () => [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.09, 0.3, i * 0.07)),
  levelup: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('square', f, f, 0.08, 0.28, i * 0.06)),
  shoot: () => tone('square', 1400, 300, 0.09, 0.22),
  laser: () => tone('sawtooth', 900, 120, 0.12, 0.2),
  boom: () => { noise(0.45, 0.6, 0, 3000, sfxBus, 120); tone('square', 120, 40, 0.3, 0.25); },
  pop: () => { noise(0.12, 0.4, 0, 6000, sfxBus, 800); tone('square', 600, 200, 0.08, 0.18); },
  hit: () => tone('square', 440, 880, 0.04, 0.25),
  brick: () => tone('square', 880 + Math.random() * 300, 880, 0.05, 0.22),
  wall: () => tone('triangle', 300, 300, 0.04, 0.35),
  eat: () => tone('square', 700, 900, 0.035, 0.15),
  power: () => { for (let i = 0; i < 6; i++) tone('square', 300 + i * 120, 300 + i * 120, 0.05, 0.25, i * 0.04); },
  gulp: () => tone('square', 200, 1200, 0.18, 0.3),
  hop: () => tone('square', 400, 700, 0.06, 0.22),
  splash: () => noise(0.4, 0.45, 0, 2000, sfxBus, 300),
  thrust: () => noise(0.08, 0.18, 0, 900),
  launch: () => tone('triangle', 200, 900, 0.18, 0.35),
  die: () => { for (let i = 0; i < 8; i++) tone('square', 800 - i * 80, 760 - i * 80, 0.06, 0.25, i * 0.06); noise(0.5, 0.3, 0.45, 2000, sfxBus, 100); },
  over: () => [392, 349, 330, 262].forEach((f, i) => tone('square', f, f * 0.98, 0.22, 0.3, i * 0.22)),

function sfx(name) {
  if (!prefs().sound) return;
  if (!ensure()) return;
  try { (SFX[name] || SFX.blip)(); } catch (e) {}

/* ---- music ---- */
const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const freq = n => { const m = n.match(/^([A-G]#?)(\d)$/); if (!m) return 0; return 440 * Math.pow(2, (NOTE[m[1]] + (m[2] - 4) * 12 - 9) / 12); };
const seq = s => s.replace(/\|/g, ' ').trim().split(/\s+/);
// Original loops written for NUTCADE.
const TRACKS = {
  title: { bpm: 132, lead: seq('C5 . E5 G5 . E5 C5 . | D5 . F5 A5 . F5 D5 . | E5 . G5 B5 . G5 E5 . | F5 E5 D5 C5 . G4 . . | C5 . E5 G5 . E5 C5 . | D5 . F5 A5 . C6 A5 . | G5 . E5 . F5 . D5 . | C5 . G4 . C5 . . .'),
    bass: seq('C3 . C3 . G2 . G2 . | D3 . D3 . A2 . A2 . | E3 . E3 . B2 . B2 . | F3 . G3 . C3 . G2 . | C3 . C3 . G2 . G2 . | D3 . D3 . F3 . F3 . | G2 . G2 . G2 . B2 . | C3 . G2 . C3 . . .'), hat: 2 },
  action: { bpm: 150, lead: seq('A4 C5 E5 A5 G5 E5 C5 E5 | F4 A4 C5 F5 E5 C5 A4 C5 | G4 B4 D5 G5 F5 D5 B4 D5 | E5 . E5 D5 C5 B4 A4 . | A4 C5 E5 A5 G5 E5 C5 E5 | F4 A4 C5 F5 A5 F5 C5 A4 | G4 B4 D5 G5 B5 G5 D5 B4 | E5 G#4 B4 E5 . . . .'),
    bass: seq('A2 A2 A3 A2 A2 A2 A3 A2 | F2 F2 F3 F2 F2 F2 F3 F2 | G2 G2 G3 G2 G2 G2 G3 G2 | E2 E2 E3 E2 E2 E2 E3 E2 | A2 A2 A3 A2 A2 A2 A3 A2 | F2 F2 F3 F2 F2 F2 F3 F2 | G2 G2 G3 G2 G2 G2 G3 G2 | E2 E2 E3 E2 E3 E2 E3 E2'), hat: 1 },
  bounce: { bpm: 140, lead: seq('G4 . B4 D5 . B4 G5 . | E5 . C5 . D5 . B4 . | A4 . C5 E5 . C5 A5 . | F#5 . D5 . E5 . C5 . | G4 . B4 D5 . G5 F#5 G5 | A5 . G5 . E5 . D5 . | C5 . E5 . D5 . F#4 . | G4 . . . G5 . . .'),
    bass: seq('G2 . D3 . G2 . D3 . | C3 . G2 . G2 . D3 . | A2 . E3 . A2 . E3 . | D3 . A2 . D3 . A2 . | G2 . D3 . G2 . D3 . | C3 . G3 . C3 . G3 . | A2 . D3 . D3 . F#2 . | G2 . D3 . G2 . . .'), hat: 2 }
};
let cur = null, timer = null, step = 0, nextT = 0, pendingTrack = null;
function music(name) {
  if (cur === name && timer) return;
  stopMusic();
  if (!name || !prefs().music || !prefs().sound) return;
  if (!ctx || ctx.state !== 'running') { pendingTrack = name; ensure(); if (!ctx || ctx.state !== 'running') return; pendingTrack = null; }
  const tr = TRACKS[name]; if (!tr) return;
  cur = name; step = 0; nextT = ctx.currentTime + 0.05;
  const stepDur = 60 / tr.bpm / 2;
  const sched = () => {
    while (nextT < ctx.currentTime + 0.25) {
      const when = nextT - ctx.currentTime;
      const l = tr.lead[step % tr.lead.length], b = tr.bass[step % tr.bass.length];
      if (l !== '.') tone('square', freq(l), freq(l), stepDur * 0.9, 0.35, when, musBus);
      if (b !== '.') tone('triangle', freq(b), freq(b), stepDur * 0.95, 0.9, when, musBus);
      if (step % tr.hat === 0) noise(0.03, step % 8 === 4 ? 0.35 : 0.15, when, 8000, musBus);
      if (step % 8 === 4 && tr.hat === 1) noise(0.08, 0.3, when, 1500, musBus);
      step++; nextT += stepDur;
    }

document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {}); });

window.NutAudio = { sfx, music, stopMusic, get track() { return cur; } };
})();

<script>/* NUTCADE wallet core + UI */
(function(){
'use strict';
const L = window.CashuLib;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = a => a == null ? 0 : (typeof a === 'object' && typeof a.toNumber === 'function') ? a.toNumber() : Number(a) || 0;
const sum = ps => (ps || []).reduce((t, p) => t + num(p.amount), 0);
const fmt = n => Math.round(num(n)).toLocaleString('en-US');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const normUrl = u => { u = String(u || '').trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u; return u.replace(/\/+$/, ''); };
const host = u => { try { const x = new URL(u); return x.host + (x.pathname === '/' ? '' : x.pathname); } catch (e) { return u; } };
const plain = ps => (ps || []).map(p => { const o = {}; for (const k in p) o[k] = p[k]; o.amount = num(p.amount); return o; });
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
const sleep = ms => new Promise(r => setTimeout(r, ms));

  get(k, d) { try { const v = localStorage.getItem('nutcade:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nutcade:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }

const S = {
  mints: store.get('mints', []),          // [{url,name,methods:{mint:[],melt:[]}}]
  active: store.get('active', null),
  proofs: store.get('proofs', {}),        // url -> proofs
  pending: store.get('pending', []),      // [{id,mint,proofs,quote,kind,txId}]
  txs: store.get('txs', []),              // newest first
  quotes: store.get('quotes', []),        // pending mint quotes
  prefs: store.get('prefs', { sound: true, crt: true })

let storageOk = store.set('probe', 1);
function save() {
  for (const k of ['mints', 'active', 'proofs', 'pending', 'txs', 'quotes', 'prefs']) storageOk = store.set(k, S[k]) && storageOk;

  { url: 'https://mint.minibits.cash/Bitcoin', name: 'Minibits', blurb: 'Run by the Minibits wallet team.' },
  { url: 'https://mint.coinos.io', name: 'Coinos', blurb: 'Mint from the Coinos web wallet.' },
  { url: 'https://mint.cubabitcoin.org', name: 'Cuba Bitcoin', blurb: 'Community mint from Cuba Bitcoin.' },
  { url: 'https://8333.space:3338', name: '8333.space', blurb: 'Long-running public Nutshell mint.' },
  { url: 'https://testnut.cashu.space', name: 'Testnut', blurb: 'Test mint. Invoices pay themselves, sats are fake.', test: true },

const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net', 'wss://relay.nostr.band', 'wss://relay.cashumints.space'];

const wallets = {};
async function getWallet(url) {
  if (wallets[url]) return wallets[url];

    const w = new L.Wallet(url, { unit: 'sat' });
    await w.loadMint();

async function addMint(url, opts = {}) {
  url = normUrl(url);
  const w = await getWallet(url);
  const info = w.getMintInfo();
  let m = S.mints.find(x => x.url === url);
  const rec = { url, name: info.name || host(url), desc: info.description || '', methods: methodsOf(w) };
  if (m) Object.assign(m, rec); else { S.mints.push(rec); m = rec; }
  if (!S.proofs[url]) S.proofs[url] = [];
  if (!S.active || opts.activate) S.active = url;
  save();
  return m;
}
const activeMint = () => S.mints.find(m => m.url === S.active) || null;
const balanceOf = url => sum(S.proofs[url]);
const totalBalance = () => S.mints.reduce((t, m) => t + balanceOf(m.url), 0);
const pendingOut = () => S.pending.reduce((t, p) => t + sum(p.proofs), 0);

function addTx(t) {
  const tx = Object.assign({ id: uid(), ts: Date.now(), note: '', status: 'done', fee: 0 }, t);
  S.txs.unshift(tx);
  save();
  return tx;
}
const txById = id => S.txs.find(t => t.id === id);
function updTx(id, patch) { const t = txById(id); if (t) Object.assign(t, patch); save(); return t; }
function addProofs(url, ps) {
  const cur = S.proofs[url] || [];
  const seen = new Set(cur.map(p => p.secret));
  for (const p of plain(ps)) if (!seen.has(p.secret)) cur.push(p);
  S.proofs[url] = cur;
  save();
}

/* ---------- RECEIVE ---------- */
async function lnMintQuote(amount, note) {
  const url = S.active; const w = await getWallet(url);
  const q = await w.createMintQuoteBolt11(amount);
  const tx = addTx({ type: 'in', method: 'ln', amount, mint: url, note, status: 'pending', request: q.request, quote: q.quote });
  S.quotes.push({ kind: 'bolt11', quote: q.quote, request: q.request, amount, mint: url, txId: tx.id, expiry: q.expiry || null });
  save();
  return tx;
}
async function onchainMintQuote(note) {
  const url = S.active; const w = await getWallet(url);
  const k = new Uint8Array(32); crypto.getRandomValues(k);
  const privkey = hex(k), pubkey = hex(L.getPubKeyFromPrivKey(k));
  const q = await w.createMintQuoteOnchain(pubkey);
  const tx = addTx({ type: 'in', method: 'onchain', amount: 0, mint: url, note, status: 'pending', request: q.request, quote: q.quote });
  S.quotes.push({ kind: 'onchain', quote: q.quote, request: q.request, mint: url, txId: tx.id, privkey, expiry: q.expiry || null });
  save();
  return tx;
}
const busyQuotes = new Set();
async function checkQuote(q) {
  if (busyQuotes.has(q.quote)) return 'busy';
  busyQuotes.add(q.quote);
  try {
    const w = await getWallet(q.mint);
    if (q.kind === 'bolt11') {
      const r = await w.checkMintQuoteBolt11(q.quote);
      if (r.state === 'PAID') {
        const proofs = await w.mintProofsBolt11(q.amount, r);
        addProofs(q.mint, proofs);
        updTx(q.txId, { status: 'done', ts: Date.now() });
        dropQuote(q); sfx('coin'); refresh();
        toast(`+${fmt(q.amount)} SAT received`, 'lime');
        return 'paid';
      }
      if (r.state === 'ISSUED') { dropQuote(q); updTx(q.txId, { status: 'done' }); refresh(); return 'paid'; }
      if (q.expiry && Date.now() / 1000 > q.expiry) { dropQuote(q); updTx(q.txId, { status: 'expired' }); refresh(); return 'expired'; }
      return 'waiting';
    } else {
      const r = await w.checkMintQuoteOnchain(q.quote);
      const avail = num(r.amount_paid) - num(r.amount_issued);
      if (avail > 0) {
        const proofs = await w.mintProofsOnchain(avail, r, q.privkey);
        const got = sum(proofs);
        addProofs(q.mint, proofs);
        const t = txById(q.txId);
        if (t && t.status === 'pending') updTx(q.txId, { status: 'done', amount: got, ts: Date.now() });
        else addTx({ type: 'in', method: 'onchain', amount: got, mint: q.mint, note: t ? t.note : '', request: q.request, quote: q.quote });
        sfx('coin'); refresh(); toast(`+${fmt(got)} SAT deposited on-chain`, 'lime');
        return 'paid';
      }
      if (q.expiry && Date.now() / 1000 > q.expiry) { dropQuote(q); const t = txById(q.txId); if (t && t.status === 'pending') updTx(q.txId, { status: 'expired' }); refresh(); return 'expired'; }
      return 'waiting';
    }
  } finally { busyQuotes.delete(q.quote); }
}
function dropQuote(q) { S.quotes = S.quotes.filter(x => x.quote !== q.quote); save(); }

function cleanToken(t) { t = String(t || '').trim().replace(/^(web\+)?cashu:(\/\/)?/i, ''); const m = t.match(/cashu[AB][A-Za-z0-9_\-+/=]+/); return m ? m[0] : t; }
function peekToken(t) {
  const meta = L.getTokenMetadata(cleanToken(t));
  return { mint: normUrl(meta.mint), amount: num(meta.amount), unit: meta.unit || 'sat', memo: meta.memo || '' };
}
async function receiveToken(token, note) {
  token = cleanToken(token);
  const meta = peekToken(token);
  if (meta.unit !== 'sat') throw new Error(`This token is in ${meta.unit}. NUTCADE handles sats only.`);
  if (!S.mints.find(m => m.url === meta.mint)) await addMint(meta.mint);
  const w = await getWallet(meta.mint);
  const proofs = await w.receive(token);
  addProofs(meta.mint, proofs);
  const got = sum(proofs);
  // mark own sent token as reclaimed if it matches
  const own = S.txs.find(t => t.token === token && t.status === 'pending');
  if (own) updTx(own.id, { status: 'reclaimed' });
  return addTx({ type: 'in', method: 'ecash', amount: got, fee: Math.max(0, meta.amount - got), mint: meta.mint, note: note || meta.memo });
}

/* ---------- SEND ---------- */
async function sendEcash(amount, note) {
  const url = S.active; const w = await getWallet(url);
  const have = S.proofs[url] || [];
  if (sum(have) < amount) throw new Error(`Not enough credits. This mint holds ${fmt(sum(have))} SAT.`);
  const { keep, send } = await w.send(amount, have, { includeFees: true });
  S.proofs[url] = plain(keep);
  const token = L.getEncodedToken({ mint: url, proofs: send, unit: 'sat' });
  save();
  return addTx({ type: 'out', method: 'ecash', amount, fee: Math.max(0, sum(send) - amount), mint: url, note, status: 'pending', token, sent: plain(send) });
}
async function meltQuote(kind, dest, amount) {
  const w = await getWallet(S.active);
  if (kind === 'ln') return w.createMeltQuoteBolt11(dest);
  return w.createMeltQuoteOnchain(dest, amount);
}
async function payMelt(kind, mq, feeIndex, note, dest) {
  const url = S.active; const w = await getWallet(url);
  const amount = num(mq.amount);
  const reserve = kind === 'ln' ? num(mq.fee_reserve) : num((mq.fee_options || []).find(f => f.fee_index === feeIndex)?.fee_reserve);
  const need = amount + reserve;
  const have = S.proofs[url] || [];
  if (sum(have) < need) throw new Error(`Not enough credits. Need ${fmt(need)} SAT including fees, this mint holds ${fmt(sum(have))}.`);
  const { keep, send } = await w.send(need, have, { includeFees: true });
  const tx = addTx({ type: 'out', method: kind, amount, mint: url, note, status: 'pending', request: dest, quote: mq.quote });
  const pend = { id: uid(), mint: url, proofs: plain(send), quote: mq.quote, kind, txId: tx.id };
  S.proofs[url] = plain(keep); S.pending.push(pend); save();
  try {
    const res = kind === 'ln' ? await w.meltProofsBolt11(mq, send) : await w.meltProofsOnchain(mq, send, feeIndex);
    const change = plain(res.change || []);
    if (change.length) addProofs(url, change);
    const st = res.quote && res.quote.state;
    if (st === 'PAID') {
      S.pending = S.pending.filter(p => p.id !== pend.id);
      updTx(tx.id, { status: 'done', fee: Math.max(0, sum(send) - amount - sum(change)), outpoint: res.quote.outpoint || null, preimage: res.quote.payment_preimage || null });
    } else {
      updTx(tx.id, { status: 'pending', fee: reserve });
    }
    save();
    return txById(tx.id);
  } catch (e) {
    await reconcile(pend).catch(() => {});
    throw friendly(e, url);
  }
}
async function reconcile(pend) {
  const w = await getWallet(pend.mint);
  let qs = null;
  try { qs = pend.kind === 'ln' ? await w.checkMeltQuoteBolt11(pend.quote) : await w.checkMeltQuoteOnchain(pend.quote); } catch (e) {}
  if (qs && qs.state === 'PAID') {
    S.pending = S.pending.filter(p => p.id !== pend.id);
    updTx(pend.txId, { status: 'done', outpoint: qs.outpoint || null });
    return 'paid';
  }
  const states = await w.checkProofsStates(pend.proofs);
  const unspent = pend.proofs.filter((p, i) => states[i] && states[i].state === 'UNSPENT');
  const stillPending = states.some(s => s.state === 'PENDING');
  if (!stillPending) {
    if (unspent.length) addProofs(pend.mint, unspent);
    S.pending = S.pending.filter(p => p.id !== pend.id);
    const allSpent = unspent.length === 0;
    updTx(pend.txId, { status: allSpent ? 'done' : 'failed' });
    save();
    return allSpent ? 'paid' : 'returned';
  }
  return 'pending';
}
async function checkClaim(tx) {
  const w = await getWallet(tx.mint);
  const st = await w.checkProofsStates(tx.sent);
  if (st.every(s => s.state === 'SPENT')) { updTx(tx.id, { status: 'claimed' }); return true; }
  return false;
}
async function cleanWallet() {
  let removed = 0;
  for (const m of S.mints) {
    const ps = S.proofs[m.url] || []; if (!ps.length) continue;
    const w = await getWallet(m.url);
    const st = await w.checkProofsStates(ps);
    const keep = ps.filter((p, i) => !st[i] || st[i].state !== 'SPENT');
    removed += ps.length - keep.length;
    S.proofs[m.url] = keep;
  }
  save();
  return removed;
}

function qrCanvas(text) {
  try {
    const qr = L.qrcode(0, text.length > 600 ? 'L' : 'M');
    qr.addData(text); qr.make();
    const n = qr.getModuleCount(), sc = 4, q = 2;
    const c = document.createElement('canvas'); c.width = c.height = (n + q * 2) * sc;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#0a0717';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect((k + q) * sc, (r + q) * sc, sc, sc);
    return c;
  } catch (e) { return null; }
}
function qrBlock(text, label) {
  const id = 'qr' + uid();
  setTimeout(() => { const el = document.getElementById(id); if (!el) return; const c = qrCanvas(text); if (c) { c.setAttribute('aria-label', label || 'QR code'); el.appendChild(c); } else { el.outerHTML = '<div class="notice cyan">Too long for a QR code. Use Copy instead.</div>'; } }, 0);
  return `<div class="qr" id="${id}"></div>`;
}

async function probeCard(el) {
  const u = el.dataset.probe; if (el.dataset.done) return; el.dataset.done = '1';
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);

    const info = await r.json();
    el.querySelector('.dot').className = 'dot';
    if (info.name) el.querySelector('[data-name]').textContent = info.name;
    const n = info.nuts || {};
    const meth = d => ((n[d] && n[d].methods) || []).filter(m => m.unit === 'sat').map(m => m.method);
    const chips = [];
    if (meth('4').includes('bolt11') || meth('5').includes('bolt11')) chips.push('<span class="chip ln">LIGHTNING</span>');
    if (meth('4').includes('onchain') || meth('5').includes('onchain')) chips.push('<span class="chip ln" style="color:var(--lime)">ON-CHAIN</span>');
    el.querySelector('[data-chips]').insertAdjacentHTML('afterbegin', chips.join(''));

  }
}
function probeAll(root) { root.querySelectorAll('[data-probe]').forEach(probeCard); }

function discoverMints(onUpdate) {
  const recs = new Map(); // url -> {pubs:Set, reviews:[]}
  const seenIds = new Set();
  const socks = []; let finished = false;
  const done = () => { if (finished) return; finished = true; socks.forEach(s => { try { s.close(); } catch (e) {} }); onUpdate(recs, true); };
  let open = 0;
  for (const r of RELAYS) {
    let ws; try { ws = new WebSocket(r); } catch (e) { continue; }
    socks.push(ws); open++;
    ws.onopen = () => { ws.send(JSON.stringify(['REQ', 'nc1', { kinds: [38000], '#k': ['38172'], limit: 600 }])); ws.send(JSON.stringify(['REQ', 'nc2', { kinds: [38172], limit: 300 }])); };
    let eose = 0;
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m[0] === 'EVENT') {
        const e = m[2]; if (!e || seenIds.has(e.id)) return; seenIds.add(e.id);
        const urls = (e.tags || []).filter(t => t[0] === 'u' && /^https?:\/\//.test(t[1] || '')).map(t => normUrl(t[1]));
        for (const u of urls) {
          if (!recs.has(u)) recs.set(u, { pubs: new Set(), reviews: [], announced: false });
          const rec = recs.get(u);
          if (e.kind === 38000) { rec.pubs.add(e.pubkey); if (e.content && e.content.length < 280) rec.reviews.push(e.content); }
          else rec.announced = true;
        }
        onUpdate(recs, false);
      } else if (m[0] === 'EOSE') { if (++eose >= 2) { try { ws.close(); } catch (e) {} if (--open <= 0) done(); } }
    };
    ws.onerror = () => { if (--open <= 0) done(); };
  }
  if (!socks.length) done();
  setTimeout(done, 8000);
  return () => { finished = true; socks.forEach(s => { try { s.close(); } catch (e) {} }); };
}
function renderDiscovered(recs, final) {
  const el = $('#nostrList'); if (!el) return;
  const known = new Set(S.mints.map(m => m.url)); const curated = new Set(CURATED.map(c => c.url));
  const rows = [...recs.entries()].filter(([u, r]) => r.pubs.size > 0 && !curated.has(u)).sort((a, b) => b[1].pubs.size - a[1].pubs.size).slice(0, 25);
  if (!rows.length) { el.innerHTML = final ? '<div class="empty-state">No recommendations came back from Nostr relays. Add a mint by address instead.</div>' : busyHTML('LISTENING TO RELAYS'); return; }
  el.innerHTML = (final ? '' : busyHTML('LISTENING TO RELAYS')) + rows.map(([u, r]) => `<div class="panel" style="gap:8px;background:var(--panel-2)" data-probe="${esc(u)}">

}

    <button class="btn solid pink block" id="payBtn">Pay ${fmt(amount)} SAT</button><div id="sheetErr"></div>`, body => {
    body.querySelector('#payBtn').onclick = e => run(e.currentTarget, 'PAYING', async () => {
      const fi = kind === 'onchain' ? parseInt((body.querySelector('input[name=fee]:checked') || {}).value || '0', 10) : 0;
      const tx = await payMelt(kind, mq, fi, note, dest);
      if (tx.status === 'done') showDone('out', amount, kind === 'ln' ? 'Lightning' : 'On-chain' + (tx.outpoint ? ' · ' + tx.outpoint.slice(0, 12) + '…' : ''));
      else { setBody(`<div class="notice">Payment is in flight. NUTCADE will settle it when the mint confirms. Check the transaction in your notes.</div><button class="btn block gold" data-act="close">OK</button>`); refresh(); }
    });
    return null;
  });
}

function openTx(id) {
  const t = txById(id); if (!t) return;
  const method = { ln: 'Lightning', ecash: 'Ecash', onchain: 'On-chain' }[t.method];
  const mint = S.mints.find(m => m.url === t.mint);
  let extra = '';
  if (t.status === 'pending' && t.method === 'ecash' && t.token) extra = `${qrBlock(t.token, 'Ecash token QR')}<div class="code">${esc(t.token)}</div>
    <div class="row" style="flex-wrap:wrap"><button class="btn sm pink" data-act="copy" data-text="${esc(t.token)}">Copy token</button><button class="btn sm" data-act="checkClaim" data-id="${t.id}">Check claimed</button><button class="btn sm gold" data-act="reclaim" data-id="${t.id}">Reclaim</button></div>`;
  else if (t.status === 'pending' && t.type === 'in' && t.method === 'ln') extra = `<button class="btn block lime" data-act="resumeInvoice" data-id="${t.id}">Show invoice</button>`;
  else if (t.status === 'pending' && t.type === 'in' && t.method === 'onchain') extra = `<div class="row" style="flex-wrap:wrap"><button class="btn sm lime" data-act="resumeAddr" data-id="${t.id}">Show address</button><button class="btn sm red" data-act="stopWatch" data-id="${t.id}">Stop watching</button></div>`;
  else if (t.status === 'pending' && t.type === 'out') extra = `<button class="btn block violet" data-act="reconcileTx" data-id="${t.id}">Check payment</button>`;
  openSheet(t.type === 'in' ? 'Received' : 'Sent', `
    <div class="credit-num" style="font-size:28px;color:${t.type === 'in' ? 'var(--lime)' : 'var(--pink)'}">${t.type === 'in' ? '+' : '−'}${t.amount ? fmt(t.amount) : '…'}<small>SAT</small></div>
    <div class="field"><label for="noteEdit">Note</label><textarea id="noteEdit" class="inp" maxlength="500" placeholder="What was this for?">${esc(t.note)}</textarea></div>
    <button class="btn solid gold block" data-act="saveNote" data-id="${t.id}">Save note</button>
    <dl class="kv"><dt>Method</dt><dd>${method}</dd><dt>Status</dt><dd>${esc(t.status)}</dd>${t.fee ? `<dt>Fee</dt><dd>${fmt(t.fee)} SAT</dd>` : ''}
    <dt>Mint</dt><dd>${esc(mint ? mint.name : host(t.mint))}</dd><dt>When</dt><dd>${new Date(t.ts).toLocaleString()}</dd>
    ${t.outpoint ? `<dt>Tx</dt><dd class="tiny">${esc(t.outpoint)}</dd>` : ''}${t.type === 'out' && t.method !== 'ecash' && t.request ? `<dt>To</dt><dd class="tiny">${esc(t.request.slice(0, 24))}…</dd>` : ''}</dl>
    ${extra}<div id="sheetErr"></div>`);
}

/* ---------- actions ---------- */
const A = {
  close: () => closeSheet(),
  tab: b => { tab = b.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); sfx('blip'); },
  pickMint: () => openMintPicker(),
  receive: () => { sfx('blip'); openReceive(supports(activeMint(), 'mint', 'bolt11') ? 'ln' : 'ecash'); },
  send: () => { sfx('select'); openSend('ecash'); },
  recvMethod: b => openReceive(b.dataset.m),
  sendMethod: b => openSend(b.dataset.m),
  copy: b => copy(b.dataset.text, b),
  hf: b => { histFilter = b.dataset.f; render(); },
  tx: b => openTx(b.dataset.id),
  addMint: b => run(b, 'ADDING', async () => { const m = await addMint(b.dataset.url, { activate: true }); sfx('coin'); toast(`${m.name} added`, 'lime'); closeSheet(); render(); }),
  addMintUrl: b => run(b, 'ADDING', async () => { const u = val('mintUrl'); if (!u.trim()) throw new Error('Type a mint address first.'); const m = await addMint(u, { activate: true }); sfx('coin'); toast(`${m.name} added`, 'lime'); closeSheet(); render(); }),
  useMint: b => { S.active = b.dataset.url; save(); closeSheet(); render(); toast('Mint switched', 'cyan'); },
  refreshMint: b => run(b, '…', async () => { delete wallets[b.dataset.url]; await addMint(b.dataset.url); render(); toast('Mint info refreshed', 'cyan'); }),
  removeMint: b => {
    const u = b.dataset.url, bal = balanceOf(u);
    if (bal > 0) { toast(`Send or move the ${fmt(bal)} SAT out of this mint before removing it.`, 'red'); sfx('err'); return; }
    openSheet('Remove mint', `<p style="margin:0">Remove ${esc(host(u))} from NUTCADE? Its transaction notes stay.</p><button class="btn solid red block" data-act="confirmRemove" data-url="${esc(u)}">Remove</button>`);
  },
  confirmRemove: b => { const u = b.dataset.url; S.mints = S.mints.filter(m => m.url !== u); delete S.proofs[u]; if (S.active === u) S.active = S.mints[0] ? S.mints[0].url : null; save(); closeSheet(); render(); },
  discover: b => {
    const el = $('#nostrList'); el.innerHTML = busyHTML('LISTENING TO RELAYS');
    const stop = discoverMints(renderDiscovered);
    const prev = sheetCleanup; sheetCleanup = () => { stop(); if (prev) prev(); };
  },
  doLnInvoice: b => run(b, 'ASKING MINT', async () => { const tx = await lnMintQuote(amt(), val('noteIn').trim()); showInvoice(tx); }),
  doOnchainAddr: b => run(b, 'ASKING MINT', async () => { const tx = await onchainMintQuote(val('noteIn').trim()); showAddress(tx); }),
  doReceiveToken: b => run(b, 'CLAIMING', async () => {
    const tok = val('tokIn'); if (!tok.trim()) throw new Error('Paste a cashu token first.');
    let meta; try { meta = peekToken(tok); } catch (e) { throw new Error("That doesn't look like a Cashu token. It should start with cashuA or cashuB."); }
    if (!S.mints.find(m => m.url === meta.mint) && !b.dataset.trust) {
      setTrust(meta); return;
    }
    const tx = await receiveToken(tok, val('noteIn').trim()); sfx('coin'); showDone('in', tx.amount, 'Ecash');
  }),
  doSendEcash: b => run(b, 'MINTING TOKEN', async () => { const tx = await sendEcash(amt(), val('noteIn').trim()); sfx('coin'); refresh(); showToken(tx); }),
  doMeltQuote: b => run(b, 'QUOTING', async () => {
    const k = b.dataset.k; let dest = val('destIn').trim().replace(/^(lightning|bitcoin):/i, '').split('?')[0];
    const note = val('noteIn').trim();
    if (k === 'ln') { if (!/^ln(bc|tb|bcrt|tbs)[0-9a-z]+$/i.test(dest)) throw new Error('Paste a Lightning invoice. It starts with lnbc.'); dest = dest.toLowerCase(); const mq = await meltQuote('ln', dest); showMeltQuote('ln', mq, dest, note); }
    else { if (!/^(bc1|tb1|bcrt1|[13mn2])[a-zA-HJ-NP-Z0-9]{20,90}$/.test(dest)) throw new Error('That Bitcoin address looks wrong. Check it and paste again.'); const a = amt(); const mq = await meltQuote('onchain', dest, a); showMeltQuote('onchain', mq, dest, note); }
  }),
  saveNote: b => { updTx(b.dataset.id, { note: val('noteEdit').trim() }); sfx('coin'); toast('Note saved', 'gold'); closeSheet(); refresh(); },
  checkClaim: b => run(b, '…', async () => { const t = txById(b.dataset.id); const c = await checkClaim(t); toast(c ? 'Claimed by the receiver' : 'Not claimed yet', c ? 'lime' : 'gold'); if (c) { closeSheet(); refresh(); } }),
  reclaim: b => run(b, 'RECLAIMING', async () => { const t = txById(b.dataset.id); await receiveToken(t.token, 'Reclaimed: ' + (t.note || 'ecash token')); updTx(t.id, { status: 'reclaimed' }); sfx('coin'); toast('Token reclaimed', 'lime'); closeSheet(); refresh(); }),
  resumeInvoice: b => { const t = txById(b.dataset.id); showInvoice(t); },
  resumeAddr: b => { const t = txById(b.dataset.id); showAddress(t); },
  stopWatch: b => { const t = txById(b.dataset.id); S.quotes = S.quotes.filter(q => q.quote !== t.quote); updTx(t.id, { status: 'expired' }); closeSheet(); refresh(); },
  reconcileTx: b => run(b, 'CHECKING', async () => { const t = txById(b.dataset.id); const p = S.pending.find(x => x.txId === t.id); if (!p) { toast('Nothing pending for this one', 'cyan'); return; } const r = await reconcile(p); toast({ paid: 'Payment confirmed', returned: 'Payment failed. Sats returned.', pending: 'Still in flight' }[r], r === 'pending' ? 'gold' : 'lime'); closeSheet(); refresh(); }),
  reconcileAll: b => run(b, '…', async () => { for (const p of [...S.pending]) await reconcile(p).catch(() => {}); refresh(); }),
  pref: b => { S.prefs[b.dataset.k] = b.checked; save(); if (!S.prefs.sound || !S.prefs.music) window.NutAudio && window.NutAudio.stopMusic(); render(); sfx('blip'); },
  backup: () => {
    const data = JSON.stringify({ app: 'nutcade', v: 1, at: new Date().toISOString(), mints: S.mints, proofs: S.proofs, pending: S.pending, txs: S.txs });
    openSheet('Backup', `<div class="notice red">This contains your spendable ecash. Keep it private.</div><div class="code" style="max-height:200px">${esc(data)}</div><button class="btn solid gold block" data-act="copy" data-text="${esc(data)}">Copy backup</button>`);
  },
  restore: () => openSheet('Restore', `<div class="field"><label for="restoreIn">Paste a NUTCADE backup</label><textarea id="restoreIn" class="inp" spellcheck="false"></textarea></div><button class="btn solid gold block" data-act="doRestore">Restore</button><div id="sheetErr"></div>`),
  doRestore: () => {
    try {
      const d = JSON.parse(val('restoreIn')); if (d.app !== 'nutcade') throw new Error('Not a NUTCADE backup.');
      for (const m of d.mints || []) if (!S.mints.find(x => x.url === m.url)) S.mints.push(m);
      for (const u in d.proofs || {}) addProofs(u, d.proofs[u]);
      const ids = new Set(S.txs.map(t => t.id)); for (const t of d.txs || []) if (!ids.has(t.id)) S.txs.push(t);
      S.txs.sort((a, b) => b.ts - a.ts);
      for (const p of d.pending || []) if (!S.pending.find(x => x.id === p.id)) S.pending.push(p);
      if (!S.active && S.mints[0]) S.active = S.mints[0].url;
      save(); closeSheet(); render(); toast('Backup restored. Run Check proofs to drop spent ecash.', 'lime');
    } catch (e) { showErr(new Error(e.message.includes('JSON') ? "That isn't valid backup text." : e.message)); }
  },
  clean: b => run(b, 'CHECKING', async () => { const n = await cleanWallet(); render(); toast(n ? `Removed ${n} spent proof${n === 1 ? '' : 's'}` : 'All proofs are good', 'lime'); })
};
function setTrust(meta) {
  const el = $('#tokPeek');
  el.innerHTML = `<div class="notice">This token is from <b>${esc(host(meta.mint))}</b>, a mint you haven't added. Claiming adds it and trusts it with ${fmt(meta.amount)} SAT.</div>`;
  const btn = $('[data-act="doReceiveToken"]'); btn.dataset.trust = '1'; btn.textContent = 'Trust mint & claim';
}

document.addEventListener('click', e => {
  if (e.target.matches('[data-scrim]')) { closeSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.type === 'checkbox') return;
  const f = A[b.dataset.act]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener('change', e => { const b = e.target.closest('[data-act="pref"]'); if (b) A.pref(b); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'hq') { histQuery = e.target.value; const list = $('#txList'); const pos = e.target.selectionStart; render(); const i = $('#hq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } }
  if (k === 'tokPeek') {
    const el = $('#tokPeek'); const v = e.target.value.trim(); if (!v) { el.innerHTML = ''; return; }
    try { const m = peekToken(v); el.innerHTML = `<dl class="kv"><dt>Amount</dt><dd style="color:var(--gold)">${fmt(m.amount)} SAT</dd><dt>Mint</dt><dd>${esc(host(m.mint))}</dd>${m.memo ? `<dt>Memo</dt><dd>${esc(m.memo)}</dd>` : ''}</dl>`; }
    catch (x) { el.innerHTML = '<div class="tiny muted">Waiting for a valid cashu token…</div>'; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer .sheet')) closeSheet(); if (e.key === 'Enter' && e.target.id === 'mintUrl') A.addMintUrl($('[data-act="addMintUrl"]')); });

/* ---------- background checks ---------- */
async function backgroundTick() {
  for (const q of [...S.quotes]) { if (q.kind === 'onchain' || (Date.now() - (txById(q.txId)?.ts || 0)) < 86400000) await checkQuote(q).catch(() => {}); }
  for (const p of [...S.pending]) await reconcile(p).catch(() => {});
  for (const t of S.txs.filter(t => t.status === 'pending' && t.method === 'ecash' && t.sent).slice(0, 10)) await checkClaim(t).catch(() => {});
}
let tickCount = 0;
setInterval(() => { if (document.hidden || $('#layer .sheet')) return; tickCount++; backgroundTick().then(() => { if (!$('#layer .sheet') && tab !== 'arcade') refresh(); }); }, 30000);

window.Nutcade = { render, refresh, S, toast, logoSVG, sfx, openSheet, closeSheet, esc, fmt };
render();
if (S.mints.length) setTimeout(() => backgroundTick().then(() => { if (!$('#layer .sheet') && tab !== 'arcade') refresh(); }), 1200);
})();
</script>
<script>/* NUTCADE arcade: engine + seven original 80s-style games */
(function(){
'use strict';
const W = 224, H = 288;
const A = () => window.NutAudio || { sfx() {}, music() {}, stopMusic() {} };
const store = window.NutStore || { get: (k, d) => d, set() {} };
const C = { bg: '#05030c', ink: '#ece7ff', dim: '#8b82b8', pink: '#ff3d8b', cyan: '#2de2ff', gold: '#ffcf3a', lime: '#5dff7a', red: '#ff5444', violet: '#8d6bff', orange: '#ff9a1f', white: '#ffffff', blue: '#3d6bff', brown: '#b8651f', wood: '#8a4b1c' };
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hitBox = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- drawing helpers ---------- */
function spr(ctx, rows, x, y, pal, s = 1, flip = false) {
  for (let r = 0; r < rows.length; r++) { const row = rows[r]; for (let c = 0; c < row.length; c++) { const ch = row[flip ? row.length - 1 - c : c]; if (ch === '.' || !pal[ch]) continue; ctx.fillStyle = pal[ch]; ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), s, s); } }
}
function text(ctx, s, x, y, col = C.ink, size = 8, align = 'left') {
  ctx.font = `${size}px "Press Start 2P", monospace`; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillStyle = col; ctx.fillText(s, Math.round(x), Math.round(y));
}
const pad6 = n => String(Math.max(0, Math.floor(n))).padStart(6, '0');

/* ---------- scores ---------- */
const scoresOf = id => store.get('scores:' + id, []);
function qualifies(id, s) { const l = scoresOf(id); return s > 0 && (l.length < 5 || s > l[l.length - 1].s); }
function addScore(id, n, s) { const l = scoresOf(id); l.push({ n: (n || 'AAA').toUpperCase().slice(0, 3), s, t: Date.now() }); l.sort((a, b) => b.s - a.s); store.set('scores:' + id, l.slice(0, 5)); }
const hiOf = id => (scoresOf(id)[0] || { s: 0 }).s;

/* =====================================================================
   GAME 1: STAR SWARM (fixed shooter)
===================================================================== */
const SHIP = ['.....c.....', '....ccc....', '....cwc....', '.c.cwwwc.c.', '.ccccwcccc.', 'ccccccccccc', 'cc.ppppp.cc', 'c...p.p...c'];
const ALIENS = [
  [['..yyyy..', '.yyyyyy.', 'yy.yy.yy', 'yyyyyyyy', '.y.yy.y.', 'y......y'], ['..yyyy..', '.yyyyyy.', 'yy.yy.yy', 'yyyyyyyy', '.y.yy.y.', '.y....y.']],
  [['.p....p.', '..pppp..', '.pwppwp.', 'pppppppp', 'p.pppp.p', '..p..p..'], ['.p....p.', 'p.pppp.p', 'ppwppwpp', 'pppppppp', '..pppp..', '.p....p.']],
  [['c......c', 'cc.cc.cc', 'cccccccc', '.cwccwc.', '..cccc..', '.c....c.'], ['.c....c.', 'cc.cc.cc', 'cccccccc', '.cwccwc.', '..cccc..', 'c......c']]
];
const APAL = { y: C.gold, p: C.pink, c: C.cyan, w: C.white };
const SPAL = { c: C.lime, w: C.white, p: C.pink };
const starfield = n => Array.from({ length: n }, () => ({ x: rnd(0, W), y: rnd(0, H), v: rnd(0.2, 1.2), c: [C.ink, C.cyan, C.pink, C.gold][ri(0, 3)] }));
function drawStars(ctx, stars, dy = 1) { for (const s of stars) { s.y += s.v * dy; if (s.y > H) { s.y = 0; s.x = rnd(0, W); } ctx.fillStyle = s.c; ctx.globalAlpha = s.v > 0.8 ? 1 : 0.5; ctx.fillRect(s.x | 0, s.y | 0, 1, 1); } ctx.globalAlpha = 1; }
const starSwarm = {
  id: 'swarm', name: 'STAR SWARM', year: '1981', blurb: 'Blast the diving formation before it lands.', track: 'action',
  help: '◀ ▶ move · A fire', keys: '← → move · Space fire',
  init(G) { const s = { stars: starfield(60), p: { x: 106, y: 256, w: 11, h: 8, inv: 120 }, shots: [], bombs: [], fx: [], wave: 0, lives: 3, t: 0 }; this.wave(s); return s; },
  wave(s) {
    s.wave++; s.al = []; s.ox = 20; s.dx = 0.25 + s.wave * 0.06; s.delay = 90;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) s.al.push({ r, c, type: r === 0 ? 2 : r < 3 ? 1 : 0, hx: c * 22, hy: 40 + r * 18, x: 0, y: -40, dive: null, alive: true, w: 8, h: 6 });
  },
  update(s, G) {
    s.t++; const p = s.p; if (p.inv > 0) p.inv--;
    if (p.dead) { if (--p.dead === 0) { if (s.lives <= 0) return G.over(); p.x = 106; p.inv = 120; } }
    else {
      if (G.held('left')) p.x -= 1.8; if (G.held('right')) p.x += 1.8;
      if (G.ptr.down) p.x += clamp(G.ptr.x - 5 - p.x, -2, 2);
      p.x = clamp(p.x, 2, W - 13);
      if ((G.hit('a') || (G.held('a') && s.t % 14 === 0) || (G.ptr.down && s.t % 16 === 0)) && s.shots.length < 3) { s.shots.push({ x: p.x + 5, y: p.y - 2, w: 1, h: 4 }); G.sfx('shoot'); }
    }
    s.shots.forEach(b => b.y -= 4.5); s.shots = s.shots.filter(b => b.y > 16);
    s.ox += s.dx; if (s.ox > 52 || s.ox < 8) s.dx *= -1;
    if (s.delay > 0) s.delay--;
    const alive = s.al.filter(a => a.alive);
    for (const a of alive) {
      const tx = s.ox + a.hx, ty = a.hy + Math.sin((s.t + a.c * 6) / 30) * 2;
      if (!a.dive) { a.x += (tx - a.x) * 0.08; a.y += (ty - a.y) * 0.08; }
      else {
        a.dive.t++; const d = a.dive;
        a.y += d.vy; a.x += Math.sin(d.t / 14) * 1.8 + (d.tx - a.x) * 0.01;
        if (d.t % 40 === 20 && s.bombs.length < 6) s.bombs.push({ x: a.x + 4, y: a.y + 6, w: 2, h: 4, v: 1.6 + s.wave * 0.1 });
        if (a.y > H + 8) { a.dive = null; a.y = -10; }
      }
      if (!a.dive && s.delay === 0 && Math.random() < 0.0016 + s.wave * 0.0006) a.dive = { t: 0, vy: 1.2 + s.wave * 0.12, tx: p.x };
      if (!a.dive && s.delay === 0 && Math.random() < 0.0008 * s.wave && s.bombs.length < 6) s.bombs.push({ x: a.x + 4, y: a.y + 6, w: 2, h: 4, v: 1.4 + s.wave * 0.1 });
      for (const b of s.shots) if (!b.gone && hitBox(b, a)) { b.gone = true; a.alive = false; G.addScore(a.dive ? (a.type + 1) * 40 : (a.type + 1) * 10); G.sfx('pop'); boom(s.fx, a.x + 4, a.y + 3, APAL[['y', 'p', 'c'][a.type]]); }
      if (!p.dead && !p.inv && hitBox(a, p)) { a.alive = false; kill(s, G); }
    }
    s.shots = s.shots.filter(b => !b.gone);
    s.bombs.forEach(b => b.y += b.v); s.bombs = s.bombs.filter(b => b.y < H);
    if (!p.dead && !p.inv) for (const b of s.bombs) if (hitBox(b, p)) { b.y = H + 9; kill(s, G); }
    tickFx(s.fx);
    if (!s.al.some(a => a.alive)) { G.sfx('levelup'); G.addScore(500 * s.wave); this.wave(s); }
    function kill(s, G) { s.lives--; s.p.dead = 90; boom(s.fx, s.p.x + 5, s.p.y + 4, C.lime, 30); G.sfx('die'); }
  },
  draw(s, G, ctx) {
    drawStars(ctx, s.stars, 0.6);
    for (const a of s.al) if (a.alive) spr(ctx, ALIENS[a.type][(s.t >> 4) & 1], a.x, a.y, APAL);
    if (!s.p.dead && !(s.p.inv && (s.t >> 2) & 1)) spr(ctx, SHIP, s.p.x, s.p.y, SPAL);
    ctx.fillStyle = C.white; s.shots.forEach(b => ctx.fillRect(b.x, b.y, 1, 4));
    ctx.fillStyle = C.red; s.bombs.forEach(b => { ctx.fillRect(b.x, b.y, 2, 4); });
    drawFx(ctx, s.fx);
    G.hud(s.lives, 'WAVE ' + s.wave);

    G.hud(null, 'SPEED ' + (9 - s.every));
  },
  thumb(ctx, t) { ctx.fillStyle = '#0e0a24'; ctx.fillRect(0, 0, 112, 84); const n = 14; for (let i = 0; i < n; i++) { const k = (t / 4 - i) ; const x = 56 + Math.cos(k / 5) * 34, y = 42 + Math.sin(k / 3.3) * 26; ctx.fillStyle = i ? '#2fb84d' : C.lime; ctx.fillRect(x | 0, y | 0, 6, 6); } spr(ctx, ['.oo.', 'oyyo', 'oyyo', '.oo.'], 80, 20, { o: C.orange, y: C.gold }, 2); }
};

const GAMES = [starSwarm, nutMaze, brickBlitz, voidRocks, hopLanes, skyShield, nibble];

/* =====================================================================
   ENGINE
===================================================================== */
const keys = {}, pressed = new Set();
let G = null, cur = null, st = null, mode = 'title', raf = 0, view = null, ctx = null, frame = 0;
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'a', KeyZ: 'a', KeyX: 'a', KeyJ: 'a', Enter: 'b', KeyP: 'b', Escape: 'esc' };
function press(k) { if (!keys[k]) pressed.add(k); keys[k] = true; }
function release(k) { keys[k] = false; }
window.addEventListener('keydown', e => { if (!view || e.target.tagName === 'INPUT') return; const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); if (k === 'esc') { closeGame(); return; } press(k); });
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) release(k); });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (mode === 'play') mode = 'pause'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') mode = 'pause'; });

const ptr = { x: W / 2, y: H / 2, down: false, over: false, sx: 0, sy: 0, st: 0 };
let tap = null, swipe = null;

function makeG() {
  const g = {
    W, H, score: 0,
    held: k => !!keys[k], hit: k => pressed.has(k), ptr,
    get tap() { return tap; }, get swipe() { return swipe; },
    sfx: n => A().sfx(n),
    addScore(n) { this.score += n; },
    over() { endGame(); },
    hud(lives, label, bottomless) {
      ctx.fillStyle = '#05030c'; ctx.fillRect(0, 0, W, 22);
      text(ctx, '1UP', 8, 3, C.red); text(ctx, pad6(this.score), 8, 12, C.ink);
      text(ctx, 'HI-SCORE', W / 2, 3, C.red, 8, 'center'); text(ctx, pad6(Math.max(hiOf(cur.id), this.score)), W / 2, 12, C.ink, 8, 'center');
      if (label) text(ctx, label, W - 8, 12, C.gold, 8, 'right');
      if (lives != null) for (let i = 0; i < lives - 1 && i < 5; i++) spr(ctx, ['.c.', 'ccc', 'c.c'], 8 + i * 6, bottomless ? H - 14 : H - 8, { c: C.lime }, 1);
    }
  };
  return g;
}
function fit() {
  if (!view) return; const frameEl = view.querySelector('.screen-frame'); const c = view.querySelector('#gameCanvas');
  const r = frameEl.getBoundingClientRect(); const k = Math.max(1, Math.min((r.width - 6) / W, (r.height - 6) / H));
  const kk = k >= 2 ? Math.floor(k * 2) / 2 : k;
  c.style.width = Math.floor(W * kk) + 'px'; c.style.height = Math.floor(H * kk) + 'px';
}
function toLogical(e) { const c = view.querySelector('#gameCanvas'); const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }

function openGame(id) {
  cur = GAMES.find(g => g.id === id); if (!cur) return;
  closeGame(true);
  view = document.createElement('div'); view.className = 'game-view'; view.setAttribute('role', 'dialog'); view.setAttribute('aria-label', cur.name);
  view.innerHTML = `<div class="game-top"><button class="btn sm red" data-g="exit">Exit</button><div class="ttl">${cur.name}</div><button class="btn sm" data-g="mute" aria-label="Toggle sound">${(window.NutPrefs || {}).sound === false ? 'SND OFF' : 'SND ON'}</button></div>
    <div class="screen-frame"><canvas id="gameCanvas" width="${W}" height="${H}" aria-label="${cur.name} game screen"></canvas></div>
    <div class="pad touch-only"><div class="dpad">${['u', 'l', 'c', 'r', 'd'].map(k => `<button class="${k}" ${k === 'c' ? 'tabindex="-1" aria-hidden="true"' : `data-k="${{ u: 'up', l: 'left', r: 'right', d: 'down' }[k]}" aria-label="${{ u: 'Up', l: 'Left', r: 'Right', d: 'Down' }[k]}"`}>${{ u: '▲', l: '◀', r: '▶', d: '▼', c: '' }[k]}</button>`).join('')}</div>
    <div class="hint">${cur.help}</div><div class="abtns"><button class="abtn b" data-k="b" aria-label="Pause">II</button><button class="abtn a" data-k="a" aria-label="A button">A</button></div></div>
    <div class="pad-keys">${cur.keys} · Enter pause · Esc exit</div><div id="entry"></div>`;
  document.body.appendChild(view);
  document.body.style.overflow = 'hidden';
  ctx = view.querySelector('#gameCanvas').getContext('2d'); ctx.imageSmoothingEnabled = false;
  view.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    const down = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); b.classList.add('on'); press(k); if (navigator.vibrate) try { navigator.vibrate(8); } catch (x) {} };
    const up = e => { b.classList.remove('on'); release(k); };
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  view.querySelector('[data-g="exit"]').onclick = () => closeGame();
  view.querySelector('[data-g="mute"]').onclick = e => { const p = window.NutPrefs || {}; p.sound = p.sound === false; store.set('prefs', p); e.currentTarget.textContent = p.sound ? 'SND ON' : 'SND OFF'; if (p.sound) A().music(mode === 'play' ? cur.track : 'title'); else A().stopMusic(); };
  const cv = view.querySelector('#gameCanvas');
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); const p = toLogical(e); Object.assign(ptr, p, { down: true, over: e.pointerType === 'mouse', sx: e.clientX, sy: e.clientY, st: performance.now() }); });
  cv.addEventListener('pointermove', e => { const p = toLogical(e); ptr.x = p.x; ptr.y = p.y; if (e.pointerType === 'mouse') ptr.over = true; });
  cv.addEventListener('pointerleave', () => { ptr.over = false; });
  const upH = e => {
    if (!ptr.down) return; ptr.down = false; const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy, d = Math.hypot(dx, dy);
    if (d > 22) swipe = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    else if (performance.now() - ptr.st < 400) tap = toLogical(e);
  };
  cv.addEventListener('pointerup', upH); cv.addEventListener('pointercancel', () => { ptr.down = false; });
  window.addEventListener('resize', fit); fit(); setTimeout(fit, 50);
  G = makeG(); mode = 'title'; frame = 0; st = null;
  A().music('title');
  if (window.Nutcade) window.Nutcade.closeSheet();
  loop();
}
function closeGame(silent) {
  cancelAnimationFrame(raf); raf = 0;
  if (view) { view.remove(); view = null; window.removeEventListener('resize', fit); document.body.style.overflow = ''; }
  for (const k in keys) keys[k] = false;
  if (!silent) { mode = 'title'; A().music('title'); if (window.Nutcade) window.Nutcade.refresh(); }
}
function startGame() { G = makeG(); st = cur.init(G); mode = 'play'; A().sfx('start'); A().music(cur.track); }
function endGame() {
  mode = 'over'; A().stopMusic(); A().sfx('over');
  const score = G.score;
  setTimeout(() => {
    if (!view) return;
    if (qualifies(cur.id, score)) showEntry(score); else { mode = 'title'; A().music('title'); }
  }, 1800);
}
function showEntry(score) {
  mode = 'entry';
  const box = view.querySelector('#entry');
  const last = store.get('initials', 'AAA');
  box.innerHTML = `<div class="scrim" style="align-items:center"><form class="sheet initials" style="border-radius:8px;border-bottom:3px solid var(--cyan);max-width:340px">
    <div style="font-family:var(--f-display);font-size:12px;color:var(--gold)">NEW HIGH SCORE</div>
    <div style="font-family:var(--f-display);font-size:18px">${pad6(score)}</div>
    <label for="ini" class="label">Enter your initials</label>
    <input id="ini" class="inp" maxlength="3" value="${last}" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn solid gold block" type="submit">Save score</button></form></div>`;
  const inp = box.querySelector('#ini'); inp.focus(); inp.select();
  inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  box.querySelector('form').addEventListener('submit', e => { e.preventDefault(); const n = (inp.value || 'AAA').padEnd(3, 'A'); store.set('initials', n); addScore(cur.id, n, score); A().sfx('coin'); box.innerHTML = ''; mode = 'title'; A().music('title'); });
}
function drawTitle() {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (!drawTitle.stars) drawTitle.stars = starfield(50); drawStars(ctx, drawTitle.stars, 0.4);
  if (!drawTitle.tc) { const c = document.createElement('canvas'); c.width = 112; c.height = 84; drawTitle.tc = c.getContext('2d'); }
  const tc = drawTitle.tc, thumb = tc.canvas; cur.thumb(tc, frame);
  ctx.drawImage(thumb, 56, 34); ctx.strokeStyle = C.violet; ctx.strokeRect(55.5, 33.5, 113, 85);
  text(ctx, cur.name, W / 2, 128, C.gold, 12, 'center');
  text(ctx, '© NUTCADE ' + cur.year, W / 2, 146, C.dim, 8, 'center');
  text(ctx, 'HIGH SCORES', W / 2, 166, C.cyan, 8, 'center');
  const sc = scoresOf(cur.id);
  for (let i = 0; i < 5; i++) { const r = sc[i]; const y = 182 + i * 12; text(ctx, `${i + 1}.`, 52, y, C.dim); text(ctx, r ? r.n : '---', 76, y, i === 0 ? C.gold : C.ink); text(ctx, r ? pad6(r.s) : '000000', 172, y, i === 0 ? C.gold : C.ink, 8, 'right'); }
  if ((frame >> 5) & 1) text(ctx, 'PRESS A OR TAP', W / 2, 252, C.pink, 8, 'center');
  text(ctx, 'CREDIT 99', W / 2, 270, C.dim, 8, 'center');
}
function loop() {
  raf = requestAnimationFrame(loop);
  if (!view) return;
  frame++;
  if (mode === 'title') {
    drawTitle();
    if (pressed.has('a') || pressed.has('b') || tap) startGame();
  } else if (mode === 'play') {
    if (pressed.has('b')) { mode = 'pause'; A().sfx('blip'); }
    else { cur.update(st, G); if (mode !== 'over' || st) { ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); cur.draw(st, G, ctx); } }
  } else if (mode === 'pause') {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); cur.draw(st, G, ctx);
    ctx.fillStyle = 'rgba(5,3,12,.7)'; ctx.fillRect(0, 22, W, H - 22);
    text(ctx, 'PAUSED', W / 2, 130, C.gold, 12, 'center'); text(ctx, 'A OR TAP TO RESUME', W / 2, 152, C.ink, 8, 'center');
    if (pressed.has('a') || pressed.has('b') || tap) { mode = 'play'; A().sfx('blip'); }
  } else if (mode === 'over' || mode === 'entry') {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); cur.draw(st, G, ctx);
    ctx.fillStyle = 'rgba(5,3,12,.6)'; ctx.fillRect(0, 22, W, H - 22);
    text(ctx, 'GAME OVER', W / 2, 130, C.red, 12, 'center');
  }
  pressed.clear(); tap = null; swipe = null;
}

/* ---------- arcade lobby ---------- */
let lobbyRaf = 0;
function mountList(el) {
  cancelAnimationFrame(lobbyRaf);
  el.innerHTML = `<div class="row between"><h2 class="h2">Arcade · ${GAMES.length} cabinets</h2><span class="tiny muted">Free play</span></div>
    <div class="cabinets">${GAMES.map(g => `<button class="cab" data-game="${g.id}" aria-label="Play ${g.name}"><canvas width="112" height="84" data-thumb="${g.id}"></canvas>
      <span class="nm">${g.name}</span><span class="ds">${g.blurb}</span><span class="hs">HI ${hiOf(g.id) ? pad6(hiOf(g.id)) + ' ' + scoresOf(g.id)[0].n : '------'}</span></button>`).join('')}</div>
    <div class="panel"><span class="h2">Hall of fame</span><div class="scores">${GAMES.map(g => { const s = scoresOf(g.id)[0]; return `<div><span style="color:var(--dim)">${g.name.split(' ')[0]}</span><span>${s ? s.n : '---'}</span><span>${s ? pad6(s.s) : '------'}</span></div>`; }).join('')}</div></div>`;
  el.querySelectorAll('[data-game]').forEach(b => b.onclick = () => { A().sfx('select'); openGame(b.dataset.game); });
  const thumbs = [...el.querySelectorAll('[data-thumb]')].map(c => ({ c, x: c.getContext('2d'), g: GAMES.find(g => g.id === c.dataset.thumb) }));
  thumbs.forEach(t => t.x.imageSmoothingEnabled = false);
  let t = 0; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick = () => { if (!el.isConnected) return; t++; if (!view) thumbs.forEach(o => o.g.thumb(o.x, t)); if (!reduce) lobbyRaf = requestAnimationFrame(tick); };
  tick();
}
function topLine() {
  const best = GAMES.map(g => ({ g, s: scoresOf(g.id)[0] })).filter(x => x.s).sort((a, b) => b.s.s - a.s.s)[0];
  return best ? `Top score: <span style="color:var(--gold)">${pad6(best.s.s)}</span> by ${best.s.n} on ${best.g.name}` : `${GAMES.length} cabinets of free play: shooters, mazes, bricks and more.`;
}
window.Arcade = { mountList, open: openGame, topLine, playing: () => !!view, games: GAMES };
if (window.Nutcade) window.Nutcade.render();
})();
</script>

</body></html>
