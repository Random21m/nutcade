  --pink:#ff3d8b; --cyan:#2de2ff; --gold:#ffcf3a; --lime:#5dff7a; --red:#ff5444; --violet:#8d6bff;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  --r:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--f-body); font-size:22px; line-height:1.15;
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(141,107,255,.28), transparent 60%),
    linear-gradient(rgba(44,33,96,.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(44,33,96,.35) 1px, transparent 1px);
  background-size:100% 100%, 28px 28px, 28px 28px;
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
.crt::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:90;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  box-shadow:inset 0 0 140px rgba(0,0,0,.75);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}

/* Marquee */
.marquee{position:relative;text-align:center;padding:18px 8px 14px;border:3px solid var(--violet);border-radius:var(--r);
  background:linear-gradient(180deg,#24104a,#130a2b);box-shadow:0 0 0 3px var(--void),0 0 0 6px var(--pink),0 0 26px rgba(255,61,139,.45)}
.marquee .logo svg{display:block;width:100%;height:auto;max-width:400px;margin:0 auto;filter:drop-shadow(0 0 10px rgba(255,61,139,.35))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad-keys{display:none;font-size:18px;color:var(--faint);text-align:center}
@media (pointer:fine){.pad.touch-only{display:none}.pad-keys{display:block}}
.marquee h1{margin:0;font-family:var(--f-display);font-size:clamp(28px,9vw,40px);letter-spacing:2px;color:var(--gold);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--violet),0 0 18px rgba(255,207,58,.6)}
.marquee .sub{margin-top:12px;font-family:var(--f-display);font-size:9px;letter-spacing:3px;color:var(--cyan)}
.bulbs{position:absolute;left:10px;right:10px;height:6px;display:flex;justify-content:space-between}
.bulbs.top{top:5px}.bulbs.bot{bottom:5px}
.bulbs i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:bulb 1.2s steps(1) infinite}
.bulbs i:nth-child(2n){animation-delay:.6s}
@keyframes bulb{50%{background:#5a4210;box-shadow:none}}

/* Screens */
.screen{display:grid;gap:18px;margin-top:18px}
.label{font-family:var(--f-display);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.h2{font-family:var(--f-display);font-size:13px;letter-spacing:2px;color:var(--cyan);margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--dim)}
.tiny{font-size:18px}

/* Credit counter */
.credits{padding:18px;border:2px solid var(--grid);background:rgba(10,7,23,.8);border-radius:var(--r);display:grid;gap:10px}
.credit-num{font-family:var(--f-display);font-size:clamp(30px,10.5vw,46px);color:var(--gold);text-shadow:0 0 14px rgba(255,207,58,.55);font-variant-numeric:tabular-nums;word-break:break-all}
.credit-num small{font-size:.38em;color:var(--pink);text-shadow:none;margin-left:8px}
.mint-pill{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 10px;border:1px solid var(--grid);border-radius:999px;background:var(--panel);font-size:19px;color:var(--ink);text-align:left}
.mint-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);flex:none}
.dot.off{background:var(--faint);box-shadow:none}

/* Arcade push buttons */
.pushes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.push{display:grid;justify-items:center;gap:10px;padding:14px 8px 12px;border:2px solid var(--grid);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.push .cap{width:76px;height:76px;border-radius:50%;border:4px solid rgba(0,0,0,.45);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 35%),var(--c);
  box-shadow:0 7px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 22px color-mix(in srgb,var(--c) 60%,transparent);
  display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:#140a20;transition:transform .06s,box-shadow .06s}
.push:active .cap{transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#000)}
.push .t{font-family:var(--f-display);font-size:11px;letter-spacing:2px}
.push.recv{--c:var(--lime)} .push.send{--c:var(--pink)}

/* Generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border:2px solid var(--c,var(--cyan));border-radius:var(--r);
  background:color-mix(in srgb,var(--c,var(--cyan)) 14%,transparent);color:var(--ink);font-family:var(--f-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;box-shadow:3px 3px 0 color-mix(in srgb,var(--c,var(--cyan)) 55%,#000)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 color-mix(in srgb,var(--c,var(--cyan)) 55%,#000)}
.btn.solid{background:var(--c,var(--cyan));color:#120a22}
.btn.block{width:100%}
.btn.pink{--c:var(--pink)}.btn.lime{--c:var(--lime)}.btn.gold{--c:var(--gold)}.btn.red{--c:var(--red)}.btn.violet{--c:var(--violet)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;padding:6px 10px;font-size:9px}
.linkbtn{background:none;border:0;color:var(--cyan);padding:4px;text-decoration:underline;text-underline-offset:3px}

/* Panels */
.panel{border:2px solid var(--grid);border-radius:var(--r);background:var(--panel);padding:14px;display:grid;gap:12px;min-width:0}
.panel.hot{border-color:var(--pink)}

/* Transactions */
.txs{display:grid;gap:8px}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--grid);border-radius:var(--r);background:rgba(21,16,48,.9);text-align:left}
.tx .ico{width:34px;height:34px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;border:2px solid currentColor;border-radius:var(--r)}
.tx.in .ico{color:var(--lime)} .tx.out .ico{color:var(--pink)}
.tx .mid{min-width:0}
.tx .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .note.empty{color:var(--faint);font-style:italic}
.tx .meta{font-size:17px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.tx .amt{font-family:var(--f-display);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.tx.in .amt{color:var(--lime)} .tx.out .amt{color:var(--pink)}
.chip{display:inline-block;padding:0 6px;border:1px solid currentColor;border-radius:3px;font-size:15px;line-height:20px;letter-spacing:1px}
.chip.ln{color:var(--gold)} .chip.ecash{color:var(--cyan)} .chip.pending{color:var(--violet)} .chip.failed{color:var(--red)} .chip.claimed{color:var(--dim)}
.empty-state{padding:22px 14px;text-align:center;border:2px dashed var(--grid);border-radius:var(--r);color:var(--dim)}
.empty-state b{display:block;font-family:var(--f-display);font-size:11px;color:var(--gold);margin-bottom:8px;font-weight:normal}

/* Forms */
.field{display:grid;gap:6px}
.field label{font-family:var(--f-display);font-size:9px;letter-spacing:2px;color:var(--dim)}
.inp{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--grid);border-radius:var(--r);background:#0b0820;color:var(--ink);font-size:24px}
.inp:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(45,226,255,.18)}
textarea.inp{min-height:84px;resize:vertical;font-size:21px;line-height:1.1}
.inp.amount{font-family:var(--f-display);font-size:22px;color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--grid);border-radius:var(--r);overflow:hidden}
.seg button{min-height:42px;border:0;background:transparent;color:var(--dim);font-family:var(--f-display);font-size:10px;letter-spacing:1px}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#0a0717}
.seg.three{grid-template-columns:repeat(3,1fr)}
.code{font-family:ui-monospace,monospace;font-size:13px;line-height:1.35;word-break:break-all;padding:10px;border:1px solid var(--grid);border-radius:var(--r);background:#0b0820;color:var(--cyan);max-height:120px;overflow:auto}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:var(--r);width:min(100%,280px);margin:0 auto}
.qr canvas{width:100%;height:auto;image-rendering:pixelated}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:20px}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.notice{padding:10px 12px;border:2px solid var(--c,var(--gold));border-radius:var(--r);background:color-mix(in srgb,var(--c,var(--gold)) 10%,transparent);font-size:19px}
.notice.red{--c:var(--red)} .notice.cyan{--c:var(--cyan)}
.spinner{display:inline-block;font-family:var(--f-display);font-size:10px;color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,7,23,.96);border-top:3px solid var(--violet);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tab{display:grid;justify-items:center;gap:6px;padding:6px 0;border:2px solid transparent;border-radius:var(--r);background:none;color:var(--dim);font-family:var(--f-display);font-size:clamp(6px,1.9vw,8px);letter-spacing:0;min-width:0;white-space:nowrap}
.tab svg{width:26px;height:26px;image-rendering:pixelated}
.tab[aria-current="page"]{color:var(--gold);border-color:var(--grid);background:var(--panel)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(5,3,14,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--panel);border:3px solid var(--cyan);border-bottom:0;border-radius:8px 8px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;box-shadow:0 -10px 40px rgba(45,226,255,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:2px;color:var(--gold)}
.x{width:40px;height:40px;border:2px solid var(--grid);border-radius:var(--r);background:none;color:var(--ink);font-family:var(--f-display);font-size:12px}

/* Toast */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:300;max-width:min(92vw,440px);padding:10px 14px;border:2px solid var(--c,var(--lime));border-radius:var(--r);background:#0b0820;font-size:20px;box-shadow:4px 4px 0 #000}

/* Arcade */
.cabinets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cab{display:grid;gap:8px;padding:0 0 12px;border:2px solid var(--grid);border-radius:var(--r);background:var(--panel);color:var(--ink);text-align:left;overflow:hidden}
.cab canvas{width:100%;aspect-ratio:4/3;display:block;background:#05030c;image-rendering:pixelated;border-bottom:2px solid var(--grid)}
.cab .nm{padding:0 10px;font-family:var(--f-display);font-size:10px;letter-spacing:1px;color:var(--gold)}
.cab .ds{padding:0 10px;font-size:18px;color:var(--dim)}
.cab .hs{padding:0 10px;font-size:17px;color:var(--cyan)}
.cab:active{border-color:var(--pink)}

.game-view{position:fixed;inset:0;z-index:120;background:#05030c;display:flex;flex-direction:column;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.game-top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.game-top .ttl{font-family:var(--f-display);font-size:10px;color:var(--gold);letter-spacing:1px;text-align:center;flex:1}
.screen-frame{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#gameCanvas{display:block;image-rendering:pixelated;border:3px solid var(--violet);box-shadow:0 0 0 3px #000,0 0 30px rgba(141,107,255,.4);background:#000;touch-action:none}
.pad{width:100%;max-width:480px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
.dpad button,.abtn{border:0;touch-action:none}
.dpad button{background:#2a2350;color:var(--dim);font-family:var(--f-display);font-size:12px;border:2px solid #000}
.dpad .u{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}.dpad .l{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
.dpad .c{grid-column:2;grid-row:2;background:#2a2350;border:2px solid #000;border-left:0;border-right:0}
.dpad button.on,.abtn.on{filter:brightness(1.6)}
.pad .hint{text-align:center;font-size:16px;color:var(--faint)}
.abtns{display:flex;gap:12px;align-items:center}
.abtn{width:70px;height:70px;border-radius:50%;font-family:var(--f-display);font-size:16px;color:#120a22;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 35%),var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000)}
.abtn.a{--c:var(--pink)}.abtn.b{--c:var(--cyan);width:52px;height:52px;font-size:11px}

.initials{display:grid;gap:12px;justify-items:center;text-align:center}
.initials input{width:6.5ch;text-align:center;text-transform:uppercase;font-family:var(--f-display);font-size:26px;letter-spacing:6px;color:var(--gold)}
.scores{width:100%;display:grid;gap:4px;font-family:var(--f-display);font-size:10px}
.scores div{display:grid;grid-template-columns:minmax(0,1fr) 3.5em auto 30px;gap:8px;text-align:left;align-items:center;min-height:30px}
.scores div span:nth-child(3){text-align:right;color:var(--gold)}
.sharebtn{width:30px;height:30px;display:grid;place-items:center;background:transparent;border:2px solid var(--violet);border-radius:var(--r);color:var(--cyan);cursor:pointer;padding:0}
.sharebtn:hover,.sharebtn:focus-visible{border-color:var(--cyan)}
.meter{height:10px;border:2px solid var(--violet);border-radius:2px;background:#0a0717;overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,#ff9a1f 8px 10px)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.trophy{display:grid;justify-items:center;gap:6px;padding:10px 4px 8px;background:var(--panel-2);border:2px solid #2a2347;border-radius:var(--r);color:var(--dim);cursor:pointer;font-family:var(--f-display);font-size:7px;line-height:1.4;text-align:center;min-width:0}
.trophy span{overflow-wrap:anywhere}
.trophy.on{border-color:var(--gold);color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,207,58,.15)}
.trophy:hover,.trophy:focus-visible{border-color:var(--cyan)}
.code.addr{font-size:15px;color:var(--gold);text-align:center}
.panel.lnaddr{background:var(--panel-2);gap:8px}
.share-card{width:100%;height:auto;border:3px solid var(--violet);border-radius:var(--r);image-rendering:auto;display:block}
.words{list-style:none;margin:0;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:2px solid var(--gold);border-radius:var(--r);background:#0b0820}
.words li{display:flex;gap:6px;align-items:baseline;padding:6px 8px;border:1px solid var(--grid);border-radius:3px;font-size:clamp(16px,5vw,22px);min-width:0;white-space:nowrap}
.words li span{font-family:var(--f-display);font-size:8px;color:var(--dim);flex:none;min-width:1.9em;text-align:right}
.gate{gap:16px;padding:18px}
.gate-h{margin:0;font-family:var(--f-display);font-size:clamp(13px,4.2vw,16px);line-height:1.5;color:var(--gold);letter-spacing:1px;text-wrap:balance}
.gate-list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.gate-list li{padding-left:22px;position:relative}
.gate-list li::before{content:"";position:absolute;left:4px;top:.45em;width:8px;height:8px;background:var(--pink);box-shadow:0 0 6px var(--pink)}
.gate-list b{color:var(--cyan);font-weight:normal}
.ack{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px dashed var(--grid);border-radius:var(--r);font-size:19px;cursor:pointer}
.ack input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--pink)}
.steps{display:flex;align-items:center;gap:6px}
.steps i{width:22px;height:6px;background:var(--grid)}
.steps i.on{background:var(--pink);box-shadow:0 0 6px var(--pink)}
.steps span{margin-left:auto;font-family:var(--f-display);font-size:8px;color:var(--dim);letter-spacing:2px}
.settings .panel{scroll-margin-top:12px}
.set-index{display:flex;flex-wrap:wrap;gap:6px}
.set-index .chip{background:none;cursor:pointer;font:inherit;font-size:16px;line-height:24px;padding:0 8px}
.sub{font-family:var(--f-display);font-size:9px;letter-spacing:2px;color:var(--gold);margin-top:6px;text-transform:uppercase}
.th{display:block;font-size:17px;line-height:1.15;color:var(--dim)}
.tl{display:block}
.toggle.set{align-items:flex-start;padding:8px 0;border-top:1px dashed var(--grid)}
.toggle.set > span{min-width:0}
.toggle.set input{margin-top:3px;flex:none}
.row.wrap{flex-wrap:wrap}
.keyrow{display:grid;gap:6px}
.mono{font-family:ui-monospace,monospace;font-size:14px}
details.adv summary{cursor:pointer;color:var(--cyan);font-size:19px}
select.inp{font-size:20px}
a.btn{text-decoration:none}
body.theme-amber{--void:#0d0905;--panel:#1b1309;--panel-2:#24190c;--grid:#4a3414;--ink:#ffe9c2;--dim:#c39a5c;--faint:#7a5f35;--pink:#ff8a1f;--cyan:#ffcf3a;--gold:#ffd77a;--lime:#ffe08a;--violet:#c9771a}
body.theme-phosphor{--void:#020a04;--panel:#071a0c;--panel-2:#0b2412;--grid:#14451f;--ink:#c9ffd4;--dim:#6fbf82;--faint:#3c7a4b;--pink:#33ff66;--cyan:#7dffa0;--gold:#b6ff5c;--lime:#33ff66;--violet:#2bbf55}
body.theme-amber,body.theme-phosphor{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px}
.pc{gap:10px}
.pc-price{font-family:var(--f-display);font-size:clamp(20px,6.4vw,28px);color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 45%,transparent);margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-chg{font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
.pc-chg.up{color:var(--lime)} .pc-chg.down{color:var(--red)}
.pc-live{font-family:var(--f-display);font-size:7px;letter-spacing:1px;color:var(--faint)}
.pc-live.on{color:var(--lime);animation:blink 1.2s steps(1) infinite}
.pc-seg{grid-template-columns:repeat(5,1fr)}
.pc-seg button{min-height:34px;font-size:9px}
.pc-wrap{position:relative;height:190px;border:1px solid var(--grid);border-radius:var(--r);background:color-mix(in srgb,var(--void) 70%,transparent);transition:opacity .2s}
.pc-canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:pan-y}
.pc-canvas:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.pc-tip{position:absolute;top:2px;display:flex;gap:8px;align-items:baseline;padding:2px 8px;background:var(--panel);border:1px solid var(--gold);border-radius:3px;pointer-events:none;white-space:nowrap;font-size:17px}
.pc-tip b{font-family:var(--f-display);font-size:10px;color:var(--ink);font-weight:normal}
.pc-tip span{color:var(--dim)}
.pc-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--f-display);font-size:9px;color:var(--dim)}
.pc-src{font-size:15px}
@media (prefers-reduced-motion:reduce){.pc-live.on{animation:none}}
#fxLayer{position:fixed;inset:0;z-index:400;pointer-events:none}
#fxLayer canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-label{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:10px;animation:fxpop 1.5s steps(12) forwards;text-align:center}
.fx-label b{font-family:var(--f-display);font-weight:normal;font-size:clamp(28px,10vw,52px);color:var(--gold);text-shadow:4px 4px 0 var(--pink),0 0 24px var(--gold)}
.fx-label.out b{color:var(--cyan);text-shadow:4px 4px 0 var(--violet),0 0 24px var(--cyan)}
.fx-label span{font-family:var(--f-display);font-size:clamp(12px,4vw,18px);color:var(--ink);background:var(--void);padding:6px 10px;border:2px solid currentColor}
@keyframes fxpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
@media (prefers-reduced-motion:reduce){.fx-label{animation:none}}
.scan-btn{gap:10px}
.ico-scan{width:16px;height:16px;flex:none;image-rendering:pixelated}
.btn .ico-scan{margin-right:2px}
.scan-box{position:relative;width:100%;aspect-ratio:1;max-height:62vh;border:3px solid var(--violet);border-radius:var(--r);overflow:hidden;background:#000}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:16%}
.scan-frame i{position:absolute;width:22%;height:22%;border:4px solid var(--lime);filter:drop-shadow(0 0 6px var(--lime))}
.scan-frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.scan-frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.scan-frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.scan-frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.scan-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-family:var(--f-display);font-size:9px;line-height:1.8;color:var(--dim)}
.pinpad{display:grid;gap:14px;justify-items:center;width:100%}
.pin-title{font-family:var(--f-display);font-size:14px;color:var(--gold);letter-spacing:2px}
.pin-dots{display:flex;gap:10px;min-height:18px}
.pin-dots i{width:14px;height:14px;border:2px solid var(--cyan)}
.pin-dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.pin-dots.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pin-err{min-height:20px;font-size:18px;color:var(--red);text-align:center}
.pin-err.busy{color:var(--gold)}
.pin-keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pin-k{height:60px;border:2px solid var(--grid);border-radius:var(--r);background:var(--panel-2);color:var(--ink);font-family:var(--f-display);font-size:18px;box-shadow:0 4px 0 #000}
.pin-k:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.pin-k.ok{background:var(--gold);color:#120a22;border-color:var(--gold);font-size:13px}
.lockbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--grid);border-radius:var(--r);background:none;color:var(--dim);padding:0}
.lockbtn svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.pin-dots.shake{animation:none}}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:21px}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}

@media (prefers-reduced-motion:reduce){.bulbs i,.spinner{animation:none}}
</style>

<script>/* NUTCADE audio: chiptune sfx + tiny sequencer for original music loops */
(function(){
'use strict';
let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
const prefs = () => window.NutPrefs || { sound: true, music: true };
function ensure() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.22; musBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ctx = null; }
  return ctx;
}
// unlock on first gesture
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { ensure(); if (pendingTrack) { const t = pendingTrack; pendingTrack = null; music(t); } }, { passive: true }));

function tone(type, f0, f1, dur, vol = 0.5, when = 0, bus = sfxBus) {
  const c = ctx; const t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bus); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.5, when = 0, cutoff = 4000, bus = sfxBus, sweepTo) {
  const c = ctx; const t = c.currentTime + when;
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const SFX = {
  blip: () => tone('square', 660, 660, 0.05, 0.3),
  select: () => { tone('square', 523, 523, 0.05, 0.3); tone('square', 784, 784, 0.07, 0.3, 0.05); },
  coin: () => { tone('square', 988, 988, 0.07, 0.35); tone('square', 1319, 1319, 0.25, 0.35, 0.07); },
  send: () => tone('square', 1200, 200, 0.25, 0.3),
  err: () => { tone('square', 220, 220, 0.1, 0.35); tone('square', 150, 150, 0.22, 0.35, 0.1); },
  start: () => [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.09, 0.3, i * 0.07)),
  levelup: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('square', f, f, 0.08, 0.28, i * 0.06)),
  shoot: () => tone('square', 1400, 300, 0.09, 0.22),
  laser: () => tone('sawtooth', 900, 120, 0.12, 0.2),
  boom: () => { noise(0.45, 0.6, 0, 3000, sfxBus, 120); tone('square', 120, 40, 0.3, 0.25); },
  pop: () => { noise(0.12, 0.4, 0, 6000, sfxBus, 800); tone('square', 600, 200, 0.08, 0.18); },
  hit: () => tone('square', 440, 880, 0.04, 0.25),
  brick: () => tone('square', 880 + Math.random() * 300, 880, 0.05, 0.22),
  wall: () => tone('triangle', 300, 300, 0.04, 0.35),
  eat: () => tone('square', 700, 900, 0.035, 0.15),
  power: () => { for (let i = 0; i < 6; i++) tone('square', 300 + i * 120, 300 + i * 120, 0.05, 0.25, i * 0.04); },
  gulp: () => tone('square', 200, 1200, 0.18, 0.3),
  hop: () => tone('square', 400, 700, 0.06, 0.22),
  splash: () => noise(0.4, 0.45, 0, 2000, sfxBus, 300),
  thrust: () => noise(0.08, 0.18, 0, 900),
  launch: () => tone('triangle', 200, 900, 0.18, 0.35),
  die: () => { for (let i = 0; i < 8; i++) tone('square', 800 - i * 80, 760 - i * 80, 0.06, 0.25, i * 0.06); noise(0.5, 0.3, 0.45, 2000, sfxBus, 100); },
  over: () => [392, 349, 330, 262].forEach((f, i) => tone('square', f, f * 0.98, 0.22, 0.3, i * 0.22)),
  tick: () => tone('square', 1800, 1800, 0.02, 0.12)
};
function sfx(name) {
  if (!prefs().sound) return;
  if (!ensure()) return;
  try { (SFX[name] || SFX.blip)(); } catch (e) {}
}

/* ---- music ---- */
const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const freq = n => { const m = n.match(/^([A-G]#?)(\d)$/); if (!m) return 0; return 440 * Math.pow(2, (NOTE[m[1]] + (m[2] - 4) * 12 - 9) / 12); };
const seq = s => s.replace(/\|/g, ' ').trim().split(/\s+/);
// Original loops written for NUTCADE.
const TRACKS = {
  title: { bpm: 132, lead: seq('C5 . E5 G5 . E5 C5 . | D5 . F5 A5 . F5 D5 . | E5 . G5 B5 . G5 E5 . | F5 E5 D5 C5 . G4 . . | C5 . E5 G5 . E5 C5 . | D5 . F5 A5 . C6 A5 . | G5 . E5 . F5 . D5 . | C5 . G4 . C5 . . .'),
    bass: seq('C3 . C3 . G2 . G2 . | D3 . D3 . A2 . A2 . | E3 . E3 . B2 . B2 . | F3 . G3 . C3 . G2 . | C3 . C3 . G2 . G2 . | D3 . D3 . F3 . F3 . | G2 . G2 . G2 . B2 . | C3 . G2 . C3 . . .'), hat: 2 },
  action: { bpm: 150, lead: seq('A4 C5 E5 A5 G5 E5 C5 E5 | F4 A4 C5 F5 E5 C5 A4 C5 | G4 B4 D5 G5 F5 D5 B4 D5 | E5 . E5 D5 C5 B4 A4 . | A4 C5 E5 A5 G5 E5 C5 E5 | F4 A4 C5 F5 A5 F5 C5 A4 | G4 B4 D5 G5 B5 G5 D5 B4 | E5 G#4 B4 E5 . . . .'),
    bass: seq('A2 A2 A3 A2 A2 A2 A3 A2 | F2 F2 F3 F2 F2 F2 F3 F2 | G2 G2 G3 G2 G2 G2 G3 G2 | E2 E2 E3 E2 E2 E2 E3 E2 | A2 A2 A3 A2 A2 A2 A3 A2 | F2 F2 F3 F2 F2 F2 F3 F2 | G2 G2 G3 G2 G2 G2 G3 G2 | E2 E2 E3 E2 E3 E2 E3 E2'), hat: 1 },
  bounce: { bpm: 140, lead: seq('G4 . B4 D5 . B4 G5 . | E5 . C5 . D5 . B4 . | A4 . C5 E5 . C5 A5 . | F#5 . D5 . E5 . C5 . | G4 . B4 D5 . G5 F#5 G5 | A5 . G5 . E5 . D5 . | C5 . E5 . D5 . F#4 . | G4 . . . G5 . . .'),
    bass: seq('G2 . D3 . G2 . D3 . | C3 . G2 . G2 . D3 . | A2 . E3 . A2 . E3 . | D3 . A2 . D3 . A2 . | G2 . D3 . G2 . D3 . | C3 . G3 . C3 . G3 . | A2 . D3 . D3 . F#2 . | G2 . D3 . G2 . . .'), hat: 2 }
};
let cur = null, timer = null, step = 0, nextT = 0, pendingTrack = null;
function music(name) {
  if (cur === name && timer) return;
  stopMusic();
  if (!name || !prefs().music || !prefs().sound) return;
  if (!ctx || ctx.state !== 'running') { pendingTrack = name; ensure(); if (!ctx || ctx.state !== 'running') return; pendingTrack = null; }
  const tr = TRACKS[name]; if (!tr) return;
  cur = name; step = 0; nextT = ctx.currentTime + 0.05;
  const stepDur = 60 / tr.bpm / 2;
  const sched = () => {
    while (nextT < ctx.currentTime + 0.25) {
      const when = nextT - ctx.currentTime;
      const l = tr.lead[step % tr.lead.length], b = tr.bass[step % tr.bass.length];
      if (l !== '.') tone('square', freq(l), freq(l), stepDur * 0.9, 0.35, when, musBus);
      if (b !== '.') tone('triangle', freq(b), freq(b), stepDur * 0.95, 0.9, when, musBus);
      if (step % tr.hat === 0) noise(0.03, step % 8 === 4 ? 0.35 : 0.15, when, 8000, musBus);
      if (step % 8 === 4 && tr.hat === 1) noise(0.08, 0.3, when, 1500, musBus);
      step++; nextT += stepDur;
    }
  };
  sched(); timer = setInterval(sched, 60);
}
function stopMusic() { if (timer) clearInterval(timer); timer = null; cur = null; pendingTrack = null; }
document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {}); });

window.NutAudio = { sfx, music, stopMusic, get track() { return cur; } };
})();
</script>
<script>/* NUTCADE wallet core + UI */
(function(){
'use strict';
const L = window.CashuLib;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = a => a == null ? 0 : (typeof a === 'object' && typeof a.toNumber === 'function') ? a.toNumber() : Number(a) || 0;
const sum = ps => (ps || []).reduce((t, p) => t + num(p.amount), 0);
const fmt = n => Math.round(num(n)).toLocaleString('en-US');
const unitTag = () => (window.NutPrefs && window.NutPrefs.btcSymbol) ? '' : 'SAT';

const normUrl = u => { u = String(u || '').trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u; return u.replace(/\/+$/, ''); };
const host = u => { try { const x = new URL(u); return x.host + (x.pathname === '/' ? '' : x.pathname); } catch (e) { return u; } };
const plain = ps => (ps || []).map(p => { const o = {}; for (const k in p) o[k] = p[k]; o.amount = num(p.amount); return o; });

/* ---------- storage ---------- */
/* Storage. When a PIN is set, the sensitive keys live only inside an encrypted vault:
   AES-GCM with a random data key, which is wrapped by a PIN-derived key (PBKDF2) and,
   optionally, by a passkey PRF secret (Face ID / fingerprint). */
const raw = {
  get(k, d) { try { const v = localStorage.getItem('nutcade:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nutcade:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('nutcade:' + k); } catch (e) {} }
};
const VAULT_KEYS = ['seed', 'proofs', 'pending', 'quotes', 'txs', 'p2pk'];
const vault = { on: raw.get('vault', null) != null, open: false, data: {}, dek: null, chain: Promise.resolve(), queued: false };
const store = {
  get(k, d) { if (vault.on && VAULT_KEYS.includes(k)) return vault.open && vault.data[k] !== undefined ? vault.data[k] : d; return raw.get(k, d); },
  set(k, v) { if (vault.on && VAULT_KEYS.includes(k)) { if (!vault.open) return false; vault.data[k] = v; queueVaultWrite(); return true; } return raw.set(k, v); }
};
const b64e = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const PBKDF2_ITER = 600000;
async function kekFromPin(pin, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}
async function kekFromSecret(secret) {
  const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('nutcade-vault-v1'), info: new TextEncoder().encode('passkey') }, base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}
async function wrapDek(dek, kek) { const iv = rnd(12); const ct = await crypto.subtle.wrapKey('raw', dek, kek, { name: 'AES-GCM', iv }); return { iv: b64e(iv), ct: b64e(ct) }; }

async function sealData() {
  const iv = rnd(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, vault.dek, new TextEncoder().encode(JSON.stringify(vault.data)));
  const rec = raw.get('vault', {}); rec.data = { iv: b64e(iv), ct: b64e(ct) };
  if (!raw.set('vault', rec)) throw new Error("This browser won't save data.");
}
function queueVaultWrite() {
  if (vault.queued) return; vault.queued = true;
  vault.chain = vault.chain.then(() => { vault.queued = false; return sealData(); }).catch(() => { vault.queued = false; });
}
async function openVault(dek) {
  const rec = raw.get('vault');
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(rec.data.iv) }, dek, b64d(rec.data.ct));
  vault.data = JSON.parse(new TextDecoder().decode(pt)); vault.dek = dek; vault.open = true;
}
async function createVault(pin) {
  const dek = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const salt = rnd(16), kek = await kekFromPin(pin, salt, PBKDF2_ITER);
  vault.data = {}; for (const k of VAULT_KEYS) vault.data[k] = S[k] !== undefined ? S[k] : null;
  vault.dek = dek;
  if (!raw.set('vault', { v: 1, kdf: { alg: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: b64e(salt) }, pin: await wrapDek(dek, kek) })) throw new Error("This browser won't save data.");
  await sealData();
  // prove it decrypts before deleting the plain copies
  const check = await unwrapDek(raw.get('vault').pin, kek); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(raw.get('vault').data.iv) }, check, b64d(raw.get('vault').data.ct));
  if (JSON.parse(new TextDecoder().decode(pt)).seed?.mnemonic !== S.seed?.mnemonic) throw new Error('Encryption check failed. Your wallet was not changed.');
  vault.on = true; vault.open = true;
  for (const k of VAULT_KEYS) raw.del(k);
}
async function pinToDek(pin) {
  const rec = raw.get('vault');
  const kek = await kekFromPin(pin, b64d(rec.kdf.salt), rec.kdf.iter);
  try { return await unwrapDek(rec.pin, kek); } catch (e) { return null; }
}
async function changePin(oldPin, newPin) {
  const dek = await pinToDek(oldPin); if (!dek) throw new Error('Current PIN is wrong.');
  const salt = rnd(16), kek = await kekFromPin(newPin, salt, PBKDF2_ITER);
  const rec = raw.get('vault'); rec.kdf = { alg: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: b64e(salt) }; rec.pin = await wrapDek(dek, kek);
  raw.set('vault', rec);
}
async function removeVault(pin) {
  const dek = await pinToDek(pin); if (!dek) throw new Error('PIN is wrong.');
  await vault.chain;
  for (const k of VAULT_KEYS) if (vault.data[k] != null) raw.set(k, vault.data[k]);
  raw.del('vault'); vault.on = false; vault.open = false; vault.dek = null; vault.data = {};
}
const pinFails = () => raw.get('pinfails', { n: 0, until: 0 });
function notePinFail() { const f = pinFails(); f.n++; if (f.n >= 5) f.until = Date.now() + Math.min(15 * 60e3, 30e3 * 2 ** (f.n - 5)); raw.set('pinfails', f); return f; }

const S = {
  mints: store.get('mints', []),          // [{url,name,methods:{mint:[],melt:[]}}]
  active: store.get('active', null),
  proofs: store.get('proofs', {}),        // url -> proofs
  pending: store.get('pending', []),      // [{id,mint,proofs,quote,kind,txId}]
  txs: store.get('txs', []),              // newest first
  quotes: store.get('quotes', []),        // pending mint quotes
  prefs: store.get('prefs', { sound: true, crt: true })
};
S.seed = store.get('seed', null);        // {mnemonic, backedUp, created}
S.counters = store.get('counters', {});  // keysetId -> next counter (NUT-13)
let storageOk = store.set('probe', 1);
function save() {
  for (const k of ['mints', 'active', 'proofs', 'pending', 'txs', 'quotes', 'prefs']) storageOk = store.set(k, S[k]) && storageOk;
}

/* ---------- recovery phrase (NUT-13 deterministic secrets) ---------- */
let seedBytes = null;
function seedFor() {
  if (!S.seed) throw new Error('Set up your recovery phrase first.');
  if (!seedBytes) seedBytes = L.mnemonicToSeedSync(S.seed.mnemonic);
  return seedBytes;
}
function persistCounters() {
  // Counters must be on disk before blinded messages go to a mint, or the same secret could be issued twice.
  if (!store.set('counters', S.counters)) throw new Error("This browser won't save data, so NUTCADE stopped before using your recovery phrase. Open it in a normal browser tab.");
}
const counterSource = {
  async reserve(id, n) { const start = S.counters[id] || 0; if (n > 0) { S.counters[id] = start + n; persistCounters(); } return { start, count: n }; },
  async reserveAt(id, start, count) { const cur = S.counters[id] || 0; if (start < cur) throw new Error('Counter range already used.'); S.counters[id] = start + count; persistCounters(); return { start, count }; },
  async advanceToAtLeast(id, minNext) { if ((S.counters[id] || 0) < minNext) { S.counters[id] = minNext; persistCounters(); } },
  async snapshot() { return Object.assign({}, S.counters); },
  async setNext(id, next) { S.counters[id] = next; persistCounters(); }
};
function setSeed(mnemonic, backedUp) {
  const changed = !S.seed || S.seed.mnemonic !== mnemonic;
  S.seed = { mnemonic, backedUp: !!backedUp, created: Date.now() };
  seedBytes = null;
  if (changed && S.prefs) { S.prefs.npc = false; S.prefs.npcSince = 0; S.prefs.npcName = ''; S.prefs.mintBackupAt = 0; S.prefs.mintBackupList = ''; if (typeof npcSocketStop === 'function') npcSocketStop(); }
  for (const k in wallets) delete wallets[k];
  if (!store.set('seed', S.seed)) throw new Error("This browser won't save data. Open NUTCADE in a normal browser tab.");
  requestPersist();
}
const newMnemonic = () => L.generateMnemonic(L.wordlist, 128);
const cleanPhrase = s => String(s || '').toLowerCase().replace(/[^a-z\s]/g, ' ').trim().split(/\s+/).filter(Boolean).join(' ');
const validPhrase = s => { try { return L.validateMnemonic(cleanPhrase(s), L.wordlist); } catch (e) { return false; } };
let persisted = null;
async function requestPersist() {
  try { if (navigator.storage && navigator.storage.persist) { persisted = await navigator.storage.persisted() || await navigator.storage.persist(); } } catch (e) { persisted = false; }
}
if (S.seed) requestPersist();

/* Swap every proof a mint holds into fresh outputs derived from the current phrase. */
async function secureMint(url) {
  const ps = S.proofs[url] || []; if (!ps.length) return 0;
  const w = await getWallet(url);
  const fresh = await withRepair(url, () => w.receive(ps));
  S.proofs[url] = plain(fresh); save();
  return sum(ps) - sum(fresh);
}
async function secureAll(onStep) {
  let fees = 0;
  for (const m of S.mints) { if (!(S.proofs[m.url] || []).length) continue; onStep && onStep(m); fees += await secureMint(m.url); }
  S.seed.secured = true; store.set('seed', S.seed);
  return fees;
}
async function restoreFromMint(url, onStep) {
  if (!S.mints.find(m => m.url === url)) await addMint(url);
  const w = await getWallet(url);
  const keysets = w.keyChain.getKeysets().filter(k => k.unit === 'sat');
  let found = [];
  for (const k of keysets) {
    onStep && onStep(`Scanning ${host(url)} · keyset ${k.id.slice(0, 8)}…`);
    const r = await w.batchRestore(300, undefined, 0, k.id);
    if (r.lastCounterWithSignature != null) await counterSource.advanceToAtLeast(k.id, r.lastCounterWithSignature + 1);
    if (r.proofs && r.proofs.length) {
      const st = await w.checkProofsStates(r.proofs);
      found = found.concat(r.proofs.filter((p, i) => st[i] && st[i].state === 'UNSPENT'));
    }
  }
  const have = new Set((S.proofs[url] || []).map(p => p.secret));
  const fresh = found.filter(p => !have.has(p.secret));
  if (fresh.length) { addProofs(url, fresh); addTx({ type: 'in', method: 'ecash', amount: sum(fresh), mint: url, note: 'Recovered with recovery phrase' }); }
  return sum(fresh);
}

/* Same phrase used on another device can leave our counters behind: the mint answers 11003.
   Catch up by rescanning that mint (which also recovers anything new), then retry once. */
const isDupOutputs = e => e && (e.code === 11003 || /already signed/i.test(String(e.message || '')));
async function withRepair(url, fn) {
  try { return await fn(); }
  catch (e) {
    if (!isDupOutputs(e)) throw e;
    await restoreFromMint(url);
    return await fn();
  }
}

  { url: 'https://mint.minibits.cash/Bitcoin', name: 'Minibits', blurb: 'Run by the Minibits wallet team.' },
  { url: 'https://mint.coinos.io', name: 'Coinos', blurb: 'Mint from the Coinos web wallet.' },

];
const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net', 'wss://relay.nostr.band', 'wss://relay.cashumints.space'];

/* ---------- wallet instances ---------- */
const wallets = {};
async function getWallet(url) {
  if (wallets[url]) return wallets[url];
  const p = (async () => {
    const w = new L.Wallet(url, { unit: 'sat', bip39seed: seedFor(), counterSource });
    await w.loadMint();
    return w;
  })();
  wallets[url] = p;
  try { return await p; } catch (e) { delete wallets[url]; throw friendly(e, url); }
}
function friendly(e, url) {
  const m = String(e && e.message || e);
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) {
    const inFrame = window.top !== window.self;
    return new Error(inFrame
      ? `Can't reach ${host(url || '')}. This preview blocks connections to mints. Open the NUTCADE file in a normal browser tab to use real sats.`
      : `Can't reach ${host(url || '')}. Check the address and your connection, then try again.`);
  }
  return e instanceof Error ? e : new Error(m);
}
function methodsOf(w) {
  const info = w.getMintInfo();
  const pick = n => { try { const s = info.isSupported(n); return s.disabled ? [] : (s.params || []).filter(m => m.unit === 'sat').map(m => ({ method: m.method, min: m.min_amount == null ? null : num(m.min_amount), max: m.max_amount == null ? null : num(m.max_amount), confirmations: m.options && m.options.confirmations })); } catch (e) { return []; } };
  return { mint: pick(4), melt: pick(5) };
}
const supports = (mint, dir, method) => !!(mint && mint.methods && (mint.methods[dir] || []).some(m => m.method === method));
const methodInfo = (mint, dir, method) => mint && mint.methods && (mint.methods[dir] || []).find(m => m.method === method);

async function addMint(url, opts = {}) {
  url = normUrl(url);
  const w = await getWallet(url);
  const info = w.getMintInfo();
  let m = S.mints.find(x => x.url === url);
  const rec = { url, name: info.name || host(url), desc: info.description || '', methods: methodsOf(w) };
  const isNew = !m;
  if (m) Object.assign(m, rec); else { S.mints.push(rec); m = rec; }
  if (!S.proofs[url]) S.proofs[url] = [];
  if (!S.active || opts.activate) S.active = url;
  save();
  if (isNew) scheduleMintBackup();
  return m;
}
const activeMint = () => S.mints.find(m => m.url === S.active) || null;
const balanceOf = url => sum(S.proofs[url]);
const totalBalance = () => S.mints.reduce((t, m) => t + balanceOf(m.url), 0);
const pendingOut = () => S.pending.reduce((t, p) => t + sum(p.proofs), 0);

function addTx(t) {
  const tx = Object.assign({ id: uid(), ts: Date.now(), note: '', status: 'done', fee: 0 }, t);
  S.txs.unshift(tx);
  save();
  return tx;
}
const txById = id => S.txs.find(t => t.id === id);
function updTx(id, patch) { const t = txById(id); if (t) Object.assign(t, patch); save(); return t; }
function addProofs(url, ps) {
  const cur = S.proofs[url] || [];
  const seen = new Set(cur.map(p => p.secret));
  for (const p of plain(ps)) if (!seen.has(p.secret)) cur.push(p);
  S.proofs[url] = cur;
  save();
}

/* ---------- RECEIVE ---------- */
async function lnMintQuote(amount, note) {
  const url = S.active; const w = await getWallet(url);
  const q = await w.createMintQuoteBolt11(amount);
  const tx = addTx({ type: 'in', method: 'ln', amount, mint: url, note, status: 'pending', request: q.request, quote: q.quote });
  S.quotes.push({ kind: 'bolt11', quote: q.quote, request: q.request, amount, mint: url, txId: tx.id, expiry: q.expiry || null });
  save();
  return tx;
}
async function onchainMintQuote(note) {
  const url = S.active; const w = await getWallet(url);
  const k = new Uint8Array(32); crypto.getRandomValues(k);
  const privkey = hex(k), pubkey = hex(L.getPubKeyFromPrivKey(k));
  const q = await w.createMintQuoteOnchain(pubkey);
  const tx = addTx({ type: 'in', method: 'onchain', amount: 0, mint: url, note, status: 'pending', request: q.request, quote: q.quote });
  S.quotes.push({ kind: 'onchain', quote: q.quote, request: q.request, mint: url, txId: tx.id, privkey, expiry: q.expiry || null });
  save();
  return tx;
}
const busyQuotes = new Set();
async function checkQuote(q) {
  if (busyQuotes.has(q.quote)) return 'busy';
  if (!S.quotes.some(x => x.quote === q.quote)) { const t = txById(q.txId); return t && t.status === 'done' ? 'paid' : 'gone'; }
  busyQuotes.add(q.quote);
  try {
    const w = await getWallet(q.mint);
    if (q.kind === 'bolt11') {
      const r = await w.checkMintQuoteBolt11(q.quote);
      if (r.state === 'PAID') {
        let cfg;
        if (r.pubkey) {   // NUT-20 locked quote (npub.cash can lock payments to your Nostr key)
          const k = npcPrivFor(r.pubkey) || (S.p2pk.find(x => hex(L.getPubKeyFromPrivKey(L.hexToBytes(x.priv))) === String(r.pubkey).toLowerCase()) || {}).priv;
          if (!k) throw new Error("This payment is locked to a key this wallet doesn't have.");
          cfg = { privkey: k };
        }
        const proofs = await withRepair(q.mint, () => w.mintProofsBolt11(q.amount, r, cfg));
        addProofs(q.mint, proofs);
        updTx(q.txId, { status: 'done', ts: Date.now() });
        dropQuote(q); sfx('coin'); refresh();
        document.dispatchEvent(new CustomEvent('nutcade:paid', { detail: q.quote }));
        if (!$('#layer .sheet')) celebrate('in', q.amount);
        toast(`+${money(q.amount)} received`, 'lime');
        return 'paid';
      }
      if (r.state === 'ISSUED') {
        // The mint issued this deposit but we never stored the ecash (app closed mid-request). Recover it from the phrase.
        const got = await restoreFromMint(q.mint).catch(() => 0);
        dropQuote(q); updTx(q.txId, { status: 'done' }); refresh();
        if (got) { sfx('coin'); toast(`Recovered ${money(got)} from an interrupted deposit`, 'lime'); }
        document.dispatchEvent(new CustomEvent('nutcade:paid', { detail: q.quote }));
        return 'paid';
      }
      if (q.expiry && Date.now() / 1000 > q.expiry) { dropQuote(q); updTx(q.txId, { status: 'expired' }); refresh(); return 'expired'; }
      return 'waiting';
    } else {
      const r = await w.checkMintQuoteOnchain(q.quote);
      const avail = num(r.amount_paid) - num(r.amount_issued);
      if (avail > 0) {
        const proofs = await withRepair(q.mint, () => w.mintProofsOnchain(avail, r, q.privkey));
        const got = sum(proofs);
        addProofs(q.mint, proofs);
        const t = txById(q.txId);
        if (t && t.status === 'pending') updTx(q.txId, { status: 'done', amount: got, ts: Date.now() });
        else addTx({ type: 'in', method: 'onchain', amount: got, mint: q.mint, note: t ? t.note : '', request: q.request, quote: q.quote });
        sfx('coin'); refresh(); toast(`+${money(got)} deposited on-chain`, 'lime');
        return 'paid';
      }
      if (q.expiry && Date.now() / 1000 > q.expiry) { dropQuote(q); const t = txById(q.txId); if (t && t.status === 'pending') updTx(q.txId, { status: 'expired' }); refresh(); return 'expired'; }
      return 'waiting';
    }
  } finally { busyQuotes.delete(q.quote); }
}
function dropQuote(q) { S.quotes = S.quotes.filter(x => x.quote !== q.quote); save(); }

function cleanToken(t) { t = String(t || '').trim().replace(/^(web\+)?cashu:(\/\/)?/i, ''); const m = t.match(/cashu[AB][A-Za-z0-9_\-+/=]+/); return m ? m[0] : t; }
function peekToken(t) {
  const meta = L.getTokenMetadata(cleanToken(t));
  return { mint: normUrl(meta.mint), amount: num(meta.amount), unit: meta.unit || 'sat', memo: meta.memo || '' };
}
async function receiveToken(token, note) {
  token = cleanToken(token);
  const meta = peekToken(token);
  if (meta.unit !== 'sat') throw new Error(`This token is in ${meta.unit}. NUTCADE handles sats only.`);
  if (!S.mints.find(m => m.url === meta.mint)) await addMint(meta.mint);
  const w = await getWallet(meta.mint);
  let proofs;
  try { proofs = await withRepair(meta.mint, () => w.receive(token, S.p2pk.length ? { privkey: p2pkPrivs() } : undefined)); }
  catch (e) { if (/witness|signature|p2pk|locked/i.test(e.message || '')) throw new Error("This ecash is locked to someone else's key, so this wallet can't claim it."); throw e; }
  addProofs(meta.mint, proofs);
  const got = sum(proofs);
  // mark own sent token as reclaimed if it matches
  const own = S.txs.find(t => t.token === token && (t.status === 'pending' || t.status === 'claimed'));   // our own unclaimed token came back
  if (own) updTx(own.id, { status: 'reclaimed' });
  return addTx({ type: 'in', method: 'ecash', amount: got, fee: Math.max(0, meta.amount - got), mint: meta.mint, note: note || meta.memo });
}

/* ---------- SEND ---------- */
async function sendEcash(amount, note, lockTo) {
  const url = S.active; const w = await getWallet(url);
  const have = S.proofs[url] || [];

    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect((k + q) * sc, (r + q) * sc, sc, sc);
    return c;
  } catch (e) { return null; }
}

  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

/* Passkey (WebAuthn PRF) unlock: the authenticator returns a secret only after Face ID / fingerprint,
   and that secret wraps the same data key the PIN wraps. */
async function bioSupported() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
}
async function prfSecret(credId, prfSalt) {
  const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: credId }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const r = a.getClientExtensionResults().prf; if (!r || !r.results || !r.results.first) throw new Error("This device's passkeys can't unlock NUTCADE. Use your PIN.");
  return new Uint8Array(r.results.first);
}
async function enableBio() {
  if (!vault.dek) throw new Error('Unlock the wallet first.');
  const prfSalt = rnd(32);
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { name: 'NUTCADE', id: location.hostname }, user: { id: rnd(16), name: 'NUTCADE wallet', displayName: 'NUTCADE wallet' },
    challenge: rnd(32), pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
    timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const ext = cred.getClientExtensionResults().prf;
  if (!ext || ext.enabled === false) throw new Error("This device's passkeys can't unlock NUTCADE. Your PIN still works.");
  const credId = new Uint8Array(cred.rawId);
  const secret = ext.results && ext.results.first ? new Uint8Array(ext.results.first) : await prfSecret(credId, prfSalt);
  const kek = await kekFromSecret(secret);
  const rec = raw.get('vault'); rec.bio = { credId: b64e(credId), prfSalt: b64e(prfSalt), wrap: await wrapDek(vault.dek, kek) }; raw.set('vault', rec);
}
async function bioToDek() {
  const rec = raw.get('vault'); const b = rec.bio;
  const secret = await prfSecret(b64d(b.credId), b64d(b.prfSalt));
  return unwrapDek(b.wrap, await kekFromSecret(secret));
}

/* P2PK keys */
function newP2PK() {
  const k = new Uint8Array(32); crypto.getRandomValues(k);
  const pub = hex(L.getPubKeyFromPrivKey(k));
  S.p2pk.push({ pub, priv: hex(k), created: Date.now() });
  if (!store.set('p2pk', S.p2pk)) throw new Error("This browser won't save data.");
  return pub;
}
const p2pkPrivs = () => S.p2pk.map(k => k.priv);
const validPub = s => /^0[23][0-9a-f]{64}$/i.test(String(s || '').trim());

/* ---------- Nostr keys from the recovery phrase (same derivation as cashu.me) ----------
   Lightning address (npub.cash): the first 32 bytes of the BIP39 seed.
   Mint-list backup (NUT-27): sha256(seed || "cashu-mint-backup"), encrypted to itself with NIP-44. */
const nostrKey = () => seedFor().slice(0, 32);
function backupKeyFrom(seed) { const tag = new TextEncoder().encode('cashu-mint-backup'); const b = new Uint8Array(seed.length + tag.length); b.set(seed); b.set(tag, seed.length); return L.sha256(b); }
const BACKUP_RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net'];   // cashu.me's defaults, so either app finds the other's backup
const relays = () => (S.prefs.relays && S.prefs.relays.length) ? S.prefs.relays : BACKUP_RELAYS;

function relayPublish(ev, timeout = 7000) {
  return new Promise(res => {
    let ok = 0, left = 0; const socks = []; let fin = false;
    const end = () => { if (fin) return; fin = true; socks.forEach(s => { try { s.close(); } catch (e) {} }); res(ok); };
    for (const r of relays()) {
      let ws; try { ws = new WebSocket(r); } catch (e) { continue; }
      socks.push(ws); left++;
      const drop = () => { if (ws._done) return; ws._done = true; if (--left <= 0) end(); };
      ws.onopen = () => ws.send(JSON.stringify(['EVENT', ev]));
      ws.onmessage = m => { let d; try { d = JSON.parse(m.data); } catch (e) { return; } if (d[0] === 'OK' && d[1] === ev.id) { if (d[2]) ok++; try { ws.close(); } catch (e) {} drop(); } };
      ws.onerror = drop; ws.onclose = drop;
    }
    if (!left) end();
    setTimeout(end, timeout);
  });
}
function relayQuery(filter, timeout = 7000) {
  return new Promise(res => {
    const out = new Map(); let left = 0; const socks = []; let fin = false;
    const end = () => { if (fin) return; fin = true; socks.forEach(s => { try { s.close(); } catch (e) {} }); res([...out.values()]); };
    for (const r of relays()) {
      let ws; try { ws = new WebSocket(r); } catch (e) { continue; }
      socks.push(ws); left++;
      const drop = () => { if (ws._done) return; ws._done = true; if (--left <= 0) end(); };
      ws.onopen = () => ws.send(JSON.stringify(['REQ', 'nc', filter]));

/* npub.cash pushes "a quote changed" over a websocket after a NIP-98 challenge, then we sync. */
let npcWs = null, npcWsTry = 0, npcWsTimer = 0;
function npcSocketStart() {

  if (npcWs && (npcWs.readyState === 0 || npcWs.readyState === 1)) return;
  const wsUrl = npcBase().replace(/^http/, 'ws') + '/api/v2/ws/quote';
  let ws; try { ws = new WebSocket(wsUrl); } catch (e) { return; }
  npcWs = ws;
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }

      catch (e) { ws.close(); return; }
      ws.send(JSON.stringify(p ? { type: 'challenge-response', payload: nip98(authUrl, method) } : { type: 'auth', token: nip98(authUrl, method) }));
    } else if (m.type === 'ok' || m.type === 'challenge-success') { npcWsTry = 0; npcSync().then(n => { if (n) refresh(); }).catch(() => {}); }
    else if (m.type === 'update') npcSync().then(n => { if (n) refresh(); }).catch(() => {});
    else if (m.type === 'error') ws.close();

  ws.onclose = () => { if (npcWs !== ws) return; npcWs = null; if (!S.prefs.npc) return; clearTimeout(npcWsTimer); npcWsTimer = setTimeout(npcSocketStart, Math.min(60e3, 1000 * 2 ** npcWsTry++) * (0.75 + Math.random() / 2)); };
}
function npcSocketStop() { clearTimeout(npcWsTimer); const w = npcWs; npcWs = null; if (w) try { w.close(1000); } catch (e) {} }

/* ---------- instant updates from mints (NUT-17 websockets); the 30-second check stays as the fallback ---------- */
const live = new Map();
const reclaiming = new Set();   // our own tokens we're taking back, so a live SPENT isn't reported as claimed   // key -> canceller | 'none' | null (connecting)
async function liveWatch(key, url, cmd, subscribe) {
  if (live.has(key)) return;
  live.set(key, null);
  try {
    const w = await getWallet(url);
    const sup = w.getMintInfo().isSupported(17);
    if (!sup || !sup.supported || !(sup.params || []).some(p => p.unit === 'sat' && (p.commands || []).includes(cmd))) { live.set(key, 'none'); return; }
    const cancel = await subscribe(w);
    if (live.get(key) === null) live.set(key, cancel); else { try { cancel(); } catch (e) {} }
  } catch (e) { live.delete(key); }
}
function liveDrop(key) { const c = live.get(key); live.delete(key); if (typeof c === 'function') try { c(); } catch (e) {} }
function liveSync() {
  if (!S.seed || tabLocked || (vault.on && !vault.open)) { for (const k of [...live.keys()]) liveDrop(k); return; }
  const want = new Set();
  for (const q of S.quotes.filter(q => q.kind === 'bolt11')) {
    const k = 'mq:' + q.quote; want.add(k);
    liveWatch(k, q.mint, 'bolt11_mint_quote', w => w.on.mintQuotePaid(q.quote, () => checkQuote(q).catch(() => {}), () => liveDrop(k)));
  }
  for (const p of S.pending.filter(p => p.kind === 'ln')) {
    const k = 'melt:' + p.quote; want.add(k);
    liveWatch(k, p.mint, 'bolt11_melt_quote', w => w.on.meltQuotePaid(p.quote, () => reconcile(p).then(r => { if (r === 'paid') { refresh(); toast('Payment confirmed', 'lime'); } }).catch(() => {}), () => liveDrop(k)));
  }
  if (S.prefs.checkSent) for (const t of S.txs.filter(t => t.status === 'pending' && t.method === 'ecash' && t.sent).slice(0, 10)) {
    const k = 'tok:' + t.id; want.add(k);
    const spent = new Set();
    liveWatch(k, t.mint, 'proof_state', w => w.on.proofStateUpdates(t.sent, ps => {
      if (ps.state !== 'SPENT') return;
      spent.add(ps.proof.secret);
      if (spent.size < t.sent.length) return;
      // The mint pushed SPENT for every proof in the token: it has been claimed (or reclaimed by us, which wins).
      const cur = txById(t.id);
      if (cur && cur.status === 'pending' && !reclaiming.has(t.id)) { updTx(t.id, { status: 'claimed' }); refresh(); toast(`Your ${money(t.amount)} token was claimed`, 'lime'); }
    }, () => liveDrop(k)));
  }
  for (const k of [...live.keys()]) if (!want.has(k)) liveDrop(k);
}

/* Sweep ecash found under a different phrase into this wallet. */
async function sweepPhrase(phrase, urls, onStep) {
  const otherSeed = L.mnemonicToSeedSync(phrase);
  let total = 0; const fails = [];
  for (const url of urls) {
    try {
      if (!S.mints.find(m => m.url === url)) await addMint(url);
      const other = new L.Wallet(url, { unit: 'sat', bip39seed: otherSeed });
      await other.loadMint();
      let found = [];
      for (const k of other.keyChain.getKeysets().filter(k => k.unit === 'sat')) {
        onStep && onStep(`Scanning ${host(url)} · keyset ${k.id.slice(0, 8)}…`);
        const r = await other.batchRestore(300, undefined, 0, k.id);
        if (r.proofs && r.proofs.length) {
          const st = await other.checkProofsStates(r.proofs);
          found = found.concat(r.proofs.filter((p, i) => st[i] && st[i].state === 'UNSPENT'));
        }
      }
      if (found.length) {
        const w = await getWallet(url);
        const mine = await withRepair(url, () => w.receive(found));
        addProofs(url, mine); total += sum(mine);
        addTx({ type: 'in', method: 'ecash', amount: sum(mine), fee: Math.max(0, sum(found) - sum(mine)), mint: url, note: 'Restored from another phrase' });
      }
    } catch (e) { fails.push(host(url)); }
  }
  return { total, fails };
}

/* Receive swap: claim at the foreign mint, then pay ourselves over Lightning into the active mint. */
async function swapIn(token, note) {
  token = cleanToken(token);
  const meta = peekToken(token);
  const dest = activeMint();
  if (!dest || !supports(dest, 'mint', 'bolt11')) throw new Error('Your active mint must accept Lightning deposits to swap into it.');
  if (!S.mints.find(m => m.url === meta.mint)) await addMint(meta.mint);
  const fw = await getWallet(meta.mint), dw = await getWallet(dest.url);
  const got = await withRepair(meta.mint, () => fw.receive(token, S.p2pk.length ? { privkey: p2pkPrivs() } : undefined));
  addProofs(meta.mint, got);
  const total = sum(S.proofs[meta.mint]);
  let amt = total - Math.max(2, Math.ceil(total * 0.02)), mq, melt, need;
  for (let i = 0; i < 4; i++) {
    if (amt < 1) throw new Error('This token is too small to cover Lightning fees for a swap. Claim it at its own mint instead.');
    mq = await dw.createMintQuoteBolt11(amt);
    melt = await fw.createMeltQuoteBolt11(mq.request);
    const inFee = num(fw.getFeesForProofs(S.proofs[meta.mint]));
    need = num(melt.amount) + num(melt.fee_reserve) + inFee;
    if (need <= total) break;
    amt -= (need - total); mq = null;
  }
  if (!mq) throw new Error("Couldn't fit the swap fees into this token. Claim it at its own mint instead.");
  const tx = addTx({ type: 'in', method: 'ln', amount: amt, mint: dest.url, note: note || `Swapped from ${host(meta.mint)}`, status: 'pending', request: mq.request, quote: mq.quote });
  S.quotes.push({ kind: 'bolt11', quote: mq.quote, request: mq.request, amount: amt, mint: dest.url, txId: tx.id }); save();
  const prevActive = S.active; S.active = meta.mint;
  try { await payMelt('ln', melt, 0, `Swap to ${dest.name}`, mq.request); }
  finally { S.active = prevActive; save(); }
  const q = S.quotes.find(x => x.quote === mq.quote);
  for (let i = 0; i < 20 && q; i++) { const r = await checkQuote(q).catch(() => 'waiting'); if (r === 'paid') break; await sleep(1000); }
  return { amt, from: meta.mint, to: dest.url };
}

function discoverMints(onUpdate) {
  const recs = new Map(); // url -> {pubs:Set, reviews:[]}
  const seenIds = new Set();
  const socks = []; let finished = false;
  const done = () => { if (finished) return; finished = true; socks.forEach(s => { try { s.close(); } catch (e) {} }); onUpdate(recs, true); };
  let open = 0;
  for (const r of RELAYS) {
    let ws; try { ws = new WebSocket(r); } catch (e) { continue; }
    socks.push(ws); open++;
    ws.onopen = () => { ws.send(JSON.stringify(['REQ', 'nc1', { kinds: [38000], '#k': ['38172'], limit: 600 }])); ws.send(JSON.stringify(['REQ', 'nc2', { kinds: [38172], limit: 300 }])); };
    let eose = 0;
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m[0] === 'EVENT') {
        const e = m[2]; if (!e || seenIds.has(e.id)) return; seenIds.add(e.id);
        const urls = (e.tags || []).filter(t => t[0] === 'u' && /^https?:\/\//.test(t[1] || '')).map(t => normUrl(t[1]));
        for (const u of urls) {
          if (!recs.has(u)) recs.set(u, { pubs: new Set(), reviews: [], announced: false });
          const rec = recs.get(u);
          if (e.kind === 38000) { rec.pubs.add(e.pubkey); if (e.content && e.content.length < 280) rec.reviews.push(e.content); }
          else rec.announced = true;
        }
        onUpdate(recs, false);
      } else if (m[0] === 'EOSE') { if (++eose >= 2) { try { ws.close(); } catch (e) {} if (--open <= 0) done(); } }
    };
    ws.onerror = () => { if (--open <= 0) done(); };
  }
  if (!socks.length) done();
  setTimeout(done, 8000);
  return () => { finished = true; socks.forEach(s => { try { s.close(); } catch (e) {} }); };
}

const val = id => ($('#' + id) || {}).value || '';
const amt = () => { const n = parseInt(val('amtIn').replace(/[^0-9]/g, ''), 10); if (!n || n <= 0) throw new Error('Enter an amount in sats, like 1000.'); return n; };
function showErr(e) { sfx('err'); const el = $('#sheetErr'); if (el) el.innerHTML = errHTML(e); else toast(e.message || String(e), 'red'); }
async function run(btn, label, fn) {
  const old = btn ? btn.innerHTML : ''; if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner">${label}</span>`; }
  try { return await fn(); } catch (e) { showErr(friendly(e, S.active)); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

function showInvoice(tx) {
  const q = S.quotes.find(x => x.quote === tx.quote);
  setBody(`<div class="label" style="text-align:center">Pay this invoice</div>
    <div class="credit-num" style="text-align:center;font-size:26px">${fmt(tx.amount)}<small>${unitTag()}</small></div>
    ${qrBlock('lightning:' + tx.request.toUpperCase(), 'Lightning invoice QR')}
    <div class="code">${esc(tx.request)}</div>
    <div class="row"><button class="btn block" data-act="copy" data-text="${esc(tx.request)}">Copy invoice</button></div>
    <div class="row" style="justify-content:center"><span class="spinner" id="payState">WAITING FOR PAYMENT</span></div>`, () => {
    if (!q) return null;
    let alive = true;
    const onPaid = e => { if (e.detail === q.quote && alive) { alive = false; showDone('in', tx.amount, 'Lightning'); } };
    document.addEventListener('nutcade:paid', onPaid);
    liveSync();
    (async () => { while (alive) { try { const r = await checkQuote(q); if (r === 'paid') { if (alive) { alive = false; showDone('in', tx.amount, 'Lightning'); } return; } if (r === 'expired') { const s = $('#payState'); if (s) s.textContent = 'INVOICE EXPIRED'; return; } } catch (e) { } await sleep(3000); } })();
    return () => { alive = false; document.removeEventListener('nutcade:paid', onPaid); };
  });
}

function showMeltQuote(kind, mq, dest, note) {
  const amount = num(mq.amount);
  const opts = kind === 'onchain' ? (mq.fee_options || []) : [];
  const feeRow = kind === 'ln' ? `<dt>Fee reserve</dt><dd>${money(mq.fee_reserve)}</dd>` : '';
  setBody(`<dl class="kv"><dt>Pay</dt><dd>${money(amount)}</dd>${feeRow}<dt>To</dt><dd class="tiny">${esc(dest.length > 40 ? dest.slice(0, 18) + '…' + dest.slice(-14) : dest)}</dd>${note ? `<dt>Note</dt><dd>${esc(note)}</dd>` : ''}</dl>
    ${opts.length ? `<div class="field"><label>Fee speed</label><div class="txs">${opts.map((o, i) => `<label class="tx out" style="cursor:pointer"><span class="ico"><input type="radio" name="fee" value="${o.fee_index}" ${i === 0 ? 'checked' : ''} style="accent-color:var(--pink)"></span><span class="mid"><div class="note">~${o.estimated_blocks} block${o.estimated_blocks === 1 ? '' : 's'}</div><div class="meta">≈ ${Math.round(o.estimated_blocks * 10)} min</div></span><span class="amt">${fmt(o.fee_reserve)}</span></label>`).join('')}</div></div>` : ''}

  });
}

async function lnAddressInvoice(address, sats, comment) {
  const [user, domain] = address.split('@');
  const base = await fetch(`https://${domain}/.well-known/lnurlp/${encodeURIComponent(user)}`).then(r => { if (!r.ok) throw new Error(`The Lightning address didn't answer (${r.status}).`); return r.json(); });
  if (base.status === 'ERROR') throw new Error(base.reason || 'The Lightning address returned an error.');
  if (base.tag !== 'payRequest' || !base.callback) throw new Error("That Lightning address isn't set up for payments.");
  const msat = sats * 1000;
  if (msat < base.minSendable || msat > base.maxSendable) throw new Error(`Tips must be between ${fmt(Math.ceil(base.minSendable / 1000))} and ${money(Math.floor(base.maxSendable / 1000))}.`);
  const u = new URL(base.callback); u.searchParams.set('amount', String(msat));
  if (comment && base.commentAllowed) u.searchParams.set('comment', comment.slice(0, base.commentAllowed));
  const inv = await fetch(u.toString()).then(r => r.json());
  if (inv.status === 'ERROR' || !inv.pr) throw new Error(inv.reason || "Couldn't get an invoice from the Lightning address.");
  return inv.pr;
}

    if (pressed.has('a') || pressed.has('b') || tap) { mode = 'play'; A().sfx('blip'); }
  } else if (mode === 'over' || mode === 'entry') {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); cur.draw(st, G, ctx);
    ctx.fillStyle = 'rgba(5,3,12,.6)'; ctx.fillRect(0, 22, W, H - 22);
    text(ctx, 'GAME OVER', W / 2, 130, C.red, 12, 'center');
  }
  pressed.clear(); tap = null; swipe = null;
}

/* ---------- arcade lobby ---------- */
let lobbyRaf = 0;
function mountList(el) {
  cancelAnimationFrame(lobbyRaf);
  el.innerHTML = `<div class="row between"><h2 class="h2">Arcade · ${GAMES.length} cabinets</h2><span class="tiny muted">Free play</span></div>
    <div class="cabinets">${GAMES.map(g => `<button class="cab" data-game="${g.id}" aria-label="Play ${g.name}"><canvas width="112" height="84" data-thumb="${g.id}"></canvas>
      <span class="nm">${g.name}</span><span class="ds">${g.blurb}</span><span class="hs">HI ${hiOf(g.id) ? pad6(hiOf(g.id)) + ' ' + scoresOf(g.id)[0].n : '------'}</span></button>`).join('')}</div>
    <div class="panel"><span class="h2">Hall of fame</span><div class="scores">${GAMES.map(g => { const s = scoresOf(g.id)[0]; return `<div><span style="color:var(--dim)">${g.name.split(' ')[0]}</span><span>${s ? s.n : '---'}</span><span>${s ? pad6(s.s) : '------'}</span>${s ? `<button class="sharebtn" data-card="${g.id}" aria-label="Share ${g.name} score card"><svg viewBox="0 0 8 8" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M5 0h3v3H7V2L4 5 3 4l3-3H5zM0 2h4v1H1v4h4V4h1v4H0z"/></svg></button>` : '<span></span>'}</div>`; }).join('')}</div></div>`;
  el.querySelectorAll('[data-game]').forEach(b => b.onclick = () => { A().sfx('select'); openGame(b.dataset.game); });
  el.querySelectorAll('[data-card]').forEach(b => b.onclick = () => { const g = GAMES.find(x => x.id === b.dataset.card); const s = scoresOf(g.id)[0]; A().sfx('select'); if (window.Trophies && s) window.Trophies.openCard({ kind: 'score', game: g, score: s.s, initials: s.n, at: s.t }); });
  const thumbs = [...el.querySelectorAll('[data-thumb]')].map(c => ({ c, x: c.getContext('2d'), g: GAMES.find(g => g.id === c.dataset.thumb) }));
  thumbs.forEach(t => t.x.imageSmoothingEnabled = false);
  let t = 0; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick = () => { if (!el.isConnected) return; t++; if (!view) thumbs.forEach(o => o.g.thumb(o.x, t)); if (!reduce) lobbyRaf = requestAnimationFrame(tick); };
  tick();
}
function topLine() {
  const best = GAMES.map(g => ({ g, s: scoresOf(g.id)[0] })).filter(x => x.s).sort((a, b) => b.s.s - a.s.s)[0];
  return best ? `Top score: <span style="color:var(--gold)">${pad6(best.s.s)}</span> by ${best.s.n} on ${best.g.name}` : `${GAMES.length} cabinets of free play: shooters, mazes, bricks and more.`;
}
window.Arcade = { mountList, open: openGame, topLine, playing: () => !!view, games: GAMES };
if (window.Nutcade) window.Nutcade.render();
})();
</script>
