# NUTCADE: run every test suite, then publish public/ to GitHub Pages.
#   test:    runs every test suite against four local Nutshell test mints (fake Lightning) and a stand-in Nostr relay
#   deploy:  publishes public/ with SHA-256 checksums, only if every check passed
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.48.0-noble
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QA_OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4
      - name: Test-mint environment (Nutshell, fake Lightning)
        run: |
          python3 -m venv /tmp/mint || (apt-get update -qq && apt-get install -y -qq python3-venv && python3 -m venv /tmp/mint)
          /tmp/mint/bin/pip install -q -r tests/mint-requirements.txt
          /tmp/mint/bin/pip install -q --no-deps cashu==0.21.0 "bip32==4.0"
      - name: Browser-test environment
        run: |
          python3 -m venv /tmp/qa
          /tmp/qa/bin/pip install -q playwright==1.48.0
      - name: Run all test suites
        run: MINT_PY=/tmp/mint/bin/python QA_PY=/tmp/qa/bin/python bash tests/run_all.sh
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: qa-out/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Checksums
        run: cd public && sha256sum index.html sw.js zxing_reader.wasm > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: pages
        uses: actions/deploy-pages@v4
