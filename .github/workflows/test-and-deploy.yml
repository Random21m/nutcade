# NUTCADE: run every test suite in parallel, then publish public/ to GitHub Pages.
#   page:    checks that public/index.html matches its sources
#   test:    a matrix of parallel jobs, each running some of the test suites against only the local Nutshell test mints
#            (fake Lightning) and the stand-in Nostr relay that it needs (tests/run_all.sh --only ...)
#   deploy:  publishes public/ with SHA-256 checksums. It runs ONLY on main, and only if the page check and every test job passed.
# Pushes to other branches (and manual runs) run the checks but never deploy.
name: Test and deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# A newer push to the same branch cancels a stale run. On main a running run is left alone (it may be deploying).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  page:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.48.0-noble
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The page matches its sources
        run: python3 build.py --check

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.48.0-noble
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false   # let every job finish, so one run shows everything that failed
      matrix:
        include:
          # roughly balanced by duration (grid_backup ~16 min, r7 ~10, r8 ~10, polish ~8, the rest short)
          - name: grid_backup
            suites: grid_backup
          - name: r7
            suites: r7
          - name: r8
            suites: r8
          - name: polish
            suites: polish
          - name: core
            suites: wallet,crash,pin,games_smoke,round2,v16,r3
          - name: r4-r6
            suites: r4,r5,r6
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QA_OUT: ${{ github.workspace }}/qa-out
      SUITES: ${{ matrix.suites }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test-mint environment (Nutshell, fake Lightning)
        run: |
          python3 -m venv /tmp/mint || (apt-get update -qq && apt-get install -y -qq python3-venv && python3 -m venv /tmp/mint)
          /tmp/mint/bin/pip install -q -r tests/mint-requirements.txt
          /tmp/mint/bin/pip install -q --no-deps cashu==0.21.0 "bip32==4.0"
      - name: Browser-test environment
        run: |
          python3 -m venv /tmp/qa
          /tmp/qa/bin/pip install -q playwright==1.48.0 pillow==11.0.0
      - name: Run the test suites (${{ matrix.suites }})
        run: MINT_PY=/tmp/mint/bin/python QA_PY=/tmp/qa/bin/python bash tests/run_all.sh --only "$SUITES"
      - name: The end of each suite log (when a suite failed)
        if: failure()
        run: for f in qa-out/*_qa.log; do echo "=== $f ==="; tail -n 40 "$f" | cut -c1-400; done
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-out-${{ matrix.name }}
          path: qa-out/
          retention-days: 7

  deploy:
    # Only main deploys, and only when the page check and EVERY test job passed (needs: waits for all of the matrix).
    if: github.ref == 'refs/heads/main'
    needs: [page, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checksums
        run: cd public && sha256sum index.html sw.js zxing_reader.wasm > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
