# NUTCADE pipeline
#   test:   runs the wallet, crash-recovery, PIN-lock and arcade suites against four local
#           Nutshell test mints (fake Lightning). Runs when the app or tests change.
#   pages:  publishes public/ to GitLab Pages, with SHA-256 checksums, only if tests passed.

stages:
  - test
  - deploy

test:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.48.0-noble
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - public/index.html
        - public/zxing_reader.wasm
        - tests/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    QA_OUT: "$CI_PROJECT_DIR/qa-out"
  script:
    # test-mint environment (Nutshell, fake Lightning); the unused Spark backend is stubbed
    - python3 -m venv /tmp/mint || (apt-get update -qq && apt-get install -y -qq python3-venv && python3 -m venv /tmp/mint)
    - /tmp/mint/bin/pip install -q -r tests/mint-requirements.txt
    - /tmp/mint/bin/pip install -q --no-deps cashu==0.21.0 "bip32==4.0"
    # browser-test environment
    - python3 -m venv /tmp/qa
    - /tmp/qa/bin/pip install -q playwright==1.48.0
    - MINT_PY=/tmp/mint/bin/python QA_PY=/tmp/qa/bin/python bash tests/run_all.sh
  artifacts:
    when: always
    paths:
      - qa-out/
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - job: test
      optional: true
  script:
    - cd public && sha256sum index.html zxing_reader.wasm > SHA256SUMS.txt && cat SHA256SUMS.txt
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
